site_name: Haify
site_description: Shared storage on your own Linux servers that keeps working when a server fails.
site_url: https://haify-project.github.io/haify/
repo_url: https://github.com/haify-project/haify
repo_name: haify-project/haify
edit_uri: edit/main/docs/
copyright: Haify is open source under the Apache License 2.0. DRBD is a registered trademark of LINBIT.

docs_dir: docs
site_dir: public

theme:
  name: material
  custom_dir: docs-site/overrides
  font: false
  favicon: assets/images/favicon.svg
  logo: assets/images/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/haify.css

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's heading anchors, so links written for the repository work here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Get started:
      - Deployment: deployment-guide.md
      - Node prerequisites: node-prerequisites.md
  - User guide: user-guide.md
  - Integrations:
      - Kubernetes (CSI): kubernetes.md
      - Kubernetes (Helm chart): helm.md
      - DRBD on Kubernetes nodes: kubernetes-drbd.md
      - Nomad: nomad.md
      - Docker and Podman: docker.md
      - Proxmox VE: proxmox.md
      - XCP-ng: xcp-ng.md
      - KVM (libvirt): libvirt.md
      - OpenStack (Cinder, Horizon): openstack.md
      - OpenNebula: opennebula.md
      - Evacuating VMware vSAN: vsan-evacuation.md
      - Prometheus and Grafana: monitoring.md
      - AI assistants (MCP): mcp.md
  - 中文: zh.md

not_in_nav: |
  /img/*

# Design notes are for the people working on Haify; they stay in the
# repository and are not published.
exclude_docs: |
  /design/

validation:
  links:
    not_found: warn
    anchors: warn
