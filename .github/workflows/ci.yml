name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure embedded UI placeholder
        run: make ui-ensure

      - name: file size
        run: ./scripts/check-file-size.sh

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint is pinned to the same version `make lint` runs locally.
      # A floating version turns an upstream release into a red build on a
      # branch that changed nothing, which teaches everyone to ignore the gate.
      #
      # The two --max flags disable golangci-lint's own output truncation, not
      # any linter. It defaults to reporting 50 issues per linter and 3 per
      # distinct message, so a gate left on the defaults silently passes
      # everything past those cutoffs — and picks *which* ones to show
      # non-deterministically, so the same commit can fail on different lines
      # in two runs. This repository went from "50 issues" to 255 the moment
      # the caps came off.
      # Action v7 or newer is required to install a golangci-lint v2.x; v6
      # rejects the version string outright ("golangci-lint v2 is not supported
      # by golangci-lint-action v6") and the job dies before it lints anything.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          args: --timeout=5m --max-issues-per-linter=0 --max-same-issues=0

      - name: Build
        run: go build ./...

      # -count=1 defeats the test cache. setup-go's cache restores
      # ~/.cache/go-build, which holds test results as well as build output, so
      # without this a green "ok (cached)" can mean the tests never ran on this
      # commit at all.
      #
      # -race because this controller fans out over SSH to every node in
      # parallel and multiplexes the results; the interesting bugs here are
      # concurrent ones, and they do not reproduce on demand. The cost measured
      # on the current suite is a few seconds.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Test the libvirt hook
        run: python3 -m unittest discover -s deploy/libvirt -p 'test_*.py'
      - name: Test the Cinder driver and Horizon plugin
        run: |
          python3 -m venv /tmp/haify-py
          /tmp/haify-py/bin/pip install --quiet django
          /tmp/haify-py/bin/python -m unittest discover -s deploy/openstack/tests -p 'test_*.py'

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately the newest released Go rather than go.mod's toolchain: a
      # stdlib advisory is fixed by upgrading Go, so scanning with anything
      # older reports findings that are already fixed upstream and drowns the
      # one signal this job exists for.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Ensure embedded UI placeholder
        run: make ui-ensure

      # Its own job, deliberately: govulncheck reads a database that changes
      # without this repository changing, so it can go red on a commit that is
      # identical to yesterday's green one. Kept separate so that signal — "a
      # new advisory now reaches our code" — is never confused with "this change
      # broke the build".
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ubuntu-latest ships helm.
      - name: Lint the CSI chart
        run: helm lint --strict deploy/helm/haify-csi --set controller.address=192.0.2.10

  web-ui:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install & build
        working-directory: web-ui
        run: |
          npm ci
          npm run build
