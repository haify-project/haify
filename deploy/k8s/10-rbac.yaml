apiVersion: v1
kind: ServiceAccount
metadata: { name: haify-csi-controller, namespace: kube-system }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: haify-csi-node, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-provisioner }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  # --enable-capacity: one CSIStorageCapacity object per node, owned by the
  # controller's ReplicaSet so they are cleaned up with it.
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-provisioner }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: haify-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# csi-snapshotter sidecar: watches VolumeSnapshotContent objects and drives the
# driver's CreateSnapshot/DeleteSnapshot RPCs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-snapshotter }
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["get", "update", "patch"]
  # Reading VolumeSnapshots lets external-provisioner resolve a PVC whose
  # dataSource is a snapshot (restore), and lets the snapshotter correlate.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch"]
  # VolumeGroupSnapshot, when the group snapshot CRDs are installed.
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-snapshotter }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: haify-csi-snapshotter
  apiGroup: rbac.authorization.k8s.io
---
# csi-resizer sidecar: turns a larger PVC request into ControllerExpandVolume.
# The driver has implemented expansion all along; without this sidecar nothing
# ever called it, and editing a PVC's size did nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-resizer }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-resizer }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: haify-csi-resizer
  apiGroup: rbac.authorization.k8s.io
---
# The plugin's own health reporter: reads this driver's PVs and posts
# VolumeDegraded/VolumeRecovered events on their PVCs and the Pods using them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-health }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]
  # The Pods using a degraded volume get the same event as its PVC.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-health }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: haify-csi-health
  apiGroup: rbac.authorization.k8s.io
---
# The plugin's HA controller: watches nodes, this driver's PVs and the Pods
# using them; taints a lost node, force-deletes its Pods so they are recreated
# elsewhere, deletes their VolumeAttachments, and posts events saying so.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-ha-failover }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-ha-failover }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: haify-csi-ha-failover
  apiGroup: rbac.authorization.k8s.io
---
# Leader election: the provisioner, resizer, snapshotter and the plugin's
# health reporter and HA controller each keep a Lease here, so with more than one controller
# replica only one acts at a time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: haify-csi-leader-election, namespace: kube-system }
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: haify-csi-leader-election, namespace: kube-system }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: kube-system
roleRef:
  kind: Role
  name: haify-csi-leader-election
  apiGroup: rbac.authorization.k8s.io
