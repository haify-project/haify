apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: haify-csi-node
  namespace: kube-system
spec:
  selector: { matchLabels: { app: haify-csi-node } }
  template:
    metadata: { labels: { app: haify-csi-node } }
    spec:
      serviceAccountName: haify-csi-node
      # The kubelet never evicts a node-critical pod. Under disk pressure it
      # evicted this plugin along with the workloads, and a node with no plugin
      # cannot unmount: every volume on it stayed mounted and DRBD Primary, so
      # the evicted database could not start anywhere else until someone
      # unmounted it by hand.
      priorityClassName: system-node-critical
      hostNetwork: true
      # With hostNetwork the pod otherwise uses the node's resolv.conf and cannot
      # resolve the in-cluster `haify-controller` Service name. ClusterFirstWithHostNet
      # makes it use cluster DNS (CoreDNS) so `--haify-controller=haify-controller:3374`
      # resolves; without it the node plugin fails to reach the controller and every
      # MountDevice errors with a gRPC "EOF". The controller Deployment runs on
      # hostNetwork too and sets the same dnsPolicy.
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path=/var/lib/kubelet/plugins/haify.csi.liliang-cn.com/csi.sock"
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: registration-dir, mountPath: /registration }
        - name: plugin
          image: haify-csi:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/csi-node"]
          args:
            - "--endpoint=unix:///csi/csi.sock"
            - "--haify-controller=haify-controller:3374"
            # Re-read the I/O limits of published volumes this often, so a
            # VolumeAttributesClass change reaches running Pods.
            - "--qos-interval=30s"
          securityContext:
            privileged: true
          env:
            # The controller's API token, when it has [auth] or [rbac] on.
            # Optional: without the Secret the plugin connects without one.
            - name: HAIFY_TOKEN
              valueFrom:
                secretKeyRef: { name: haify-api-token, key: token, optional: true }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
            - { name: kubelet-dir, mountPath: /var/lib/kubelet, mountPropagation: Bidirectional }
            - { name: dev-dir, mountPath: /dev }
            # I/O limits (StorageClass readIOPS etc.) are written into the
            # pod's cgroup; see pkg/csi/qos.go.
            - { name: cgroup, mountPath: /sys/fs/cgroup }
      volumes:
        - name: socket-dir
          hostPath: { path: /var/lib/kubelet/plugins/haify.csi.liliang-cn.com, type: DirectoryOrCreate }
        - name: registration-dir
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
        - name: kubelet-dir
          hostPath: { path: /var/lib/kubelet, type: Directory }
        - name: dev-dir
          hostPath: { path: /dev, type: Directory }
        - name: cgroup
          hostPath: { path: /sys/fs/cgroup, type: Directory }
