apiVersion: apps/v1
kind: Deployment
metadata:
  name: haify-csi-controller
  namespace: kube-system
spec:
  # The sidecars and the plugin's health reporter run with leader election, so
  # more replicas are safe: one does the work, the others stand by.
  replicas: 1
  selector: { matchLabels: { app: haify-csi-controller } }
  # A replica needs a node to itself (see affinity), so an update replaces
  # them one at a time rather than starting a new one beside the old.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata: { labels: { app: haify-csi-controller } }
    spec:
      # Provisioning, resizing and snapshots stop with this pod; keep it off the
      # list the kubelet evicts from when a node runs short.
      priorityClassName: system-cluster-critical
      # Reach the external haify-controller VIP over the host network (a
      # flannel pod cannot hairpin to a VIP on its own node). DNS via CoreDNS.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: haify-csi-controller
      # On the host network two replicas on one node would both bind the
      # liveness probe's port, so each replica gets a node of its own.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: haify-csi-controller } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args:
            - "--csi-address=/csi/csi.sock"
            - "--feature-gates=Topology=true"
            - "--strict-topology"
            - "--immediate-topology=false"
            # DRBD CreateResource (LV + create-md + up + initial sync) can take
            # well over the 15s default; give it room so provisioning doesn't
            # deadline-exceed on slower storage.
            - "--timeout=120s"
            # Publish each node's free pool space for the scheduler. Level 2
            # makes the objects owned by the ReplicaSet, so a rollout does not
            # orphan them.
            - "--enable-capacity"
            - "--capacity-ownerref-level=2"
            - "--capacity-poll-interval=1m"
            # Pass each claim's namespace and name to CreateVolume, which puts
            # them on the Haify resource (label haify.csi/pvc).
            - "--extra-create-metadata"
            # One replica acts; with more than one, the others wait on the
            # Lease in kube-system and take over when it stops.
            - "--leader-election"
            - "--leader-election-namespace=kube-system"
            - "--v=2"
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        # Turns a larger PVC request into ControllerExpandVolume; the node
        # plugin then grows the filesystem online.
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
          args:
            - "--csi-address=/csi/csi.sock"
            # Growing a DRBD volume resizes the LV and runs drbdadm resize on
            # every replica over SSH.
            - "--timeout=120s"
            - "--handle-volume-inuse-error=false"
            - "--leader-election"
            - "--leader-election-namespace=kube-system"
            - "--v=2"
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        # Drives CreateSnapshot/DeleteSnapshot when a VolumeSnapshot is created.
        # Requires the cluster-wide VolumeSnapshot CRDs and snapshot-controller
        # (see deploy/k8s/README.md) — k3s and most distros do not ship them.
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          args:
            - "--csi-address=/csi/csi.sock"
            # An LVM/ZFS snapshot returns immediately, but the RPC still crosses
            # SSH to a storage node; keep the same headroom as provisioning.
            - "--timeout=120s"
            - "--leader-election"
            - "--leader-election-namespace=kube-system"
            - "--v=2"
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        - name: plugin
          image: haify-csi:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/csi-controller"]
          args:
            - "--endpoint=unix:///csi/csi.sock"
            - "--haify-controller=haify-controller:3374"
            # The health reporter runs on the replica holding the Lease, so
            # each event is posted once, not once per replica.
            - "--leader-election"
            - "--leader-election-namespace=kube-system"
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # The controller's API token, when it has [auth] or [rbac] on.
            # Optional: without the Secret the plugin connects without one.
            - name: HAIFY_TOKEN
              valueFrom:
                secretKeyRef: { name: haify-api-token, key: token, optional: true }
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
          args: ["--csi-address=/csi/csi.sock"]
          volumeMounts:
            - { name: socket-dir, mountPath: /csi }
      volumes:
        - { name: socket-dir, emptyDir: {} }
