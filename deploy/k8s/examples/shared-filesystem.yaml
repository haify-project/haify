# A shared filesystem: one ReadWriteMany volume mounted by three Pods, which
# the scheduler is free to put on three different nodes.
#
# Set nfsServiceIPs to free addresses in a network the Haify storage nodes are
# attached to and every Kubernetes node can reach, written with that network's
# prefix length. Each shared volume takes one of them. See "Shared filesystems
# (ReadWriteMany)" in ../README.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: haify-shared
provisioner: haify.csi.liliang-cn.com
parameters:
  pool: "vg0"
  replicas: "2"
  sharedFilesystem: "nfs"
  nfsServiceIPs: "192.168.1.200-192.168.1.220/24"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
spec:
  storageClassName: haify-shared
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-writers
spec:
  replicas: 3
  selector:
    matchLabels: { app: shared-writers }
  template:
    metadata:
      labels: { app: shared-writers }
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do date >> /data/$(hostname).log; sleep 5; done"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: shared-data }
