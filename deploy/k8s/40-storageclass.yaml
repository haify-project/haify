apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: haify-drbd
provisioner: haify.csi.liliang-cn.com
parameters:
  pool: "vg0"
  replicas: "2"
  storageType: "lvm"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

# Encrypted volumes: LUKS2 beneath DRBD on every replica (encryption), and
# kernel TLS on the DRBD connections (replicationTLS). Each node keeps its own
# keys; nothing is stored in Kubernetes. Run `haify replication-tls setup` on
# the Haify side before using replicationTLS. See README.md, "Encrypted
# volumes".
# ---
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: haify-encrypted
# provisioner: haify.csi.liliang-cn.com
# parameters:
#   pool: "vg0"
#   replicas: "2"
#   storageType: "lvm"
#   encryption: "true"
#   replicationTLS: "true"
# reclaimPolicy: Delete
# allowVolumeExpansion: true
# volumeBindingMode: WaitForFirstConsumer

# Volumes with an asynchronous DR replica on a Haify node at another site
# (a WAN resource through haify-proxy). drNode must be a registered Haify node
# that hosts the pool; drEndpoint is the DR site's public address, without a
# port. See "Cross-site disaster recovery" in README.md.
# ---
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: haify-drbd-dr
# provisioner: haify.csi.liliang-cn.com
# parameters:
#   pool: "vg0"
#   replicas: "2"
#   drNode: "dr1"
#   drEndpoint: "dr.example.com"
# reclaimPolicy: Delete
# allowVolumeExpansion: true
# volumeBindingMode: WaitForFirstConsumer

# Replicas in different zones: the node plugins copy each node's
# topology.kubernetes.io/zone onto the Haify node as the label "zone", and
# faultDomainLabel spreads the replicas across its values. The Pod's node gets
# the first replica; the others go to other zones. See "Zones" in README.md.
# ---
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: haify-zones
# provisioner: haify.csi.liliang-cn.com
# parameters:
#   pool: "vg0"
#   replicas: "3"
#   faultDomainLabel: "zone"
# reclaimPolicy: Delete
# allowVolumeExpansion: true
# volumeBindingMode: WaitForFirstConsumer

# Shared filesystems (ReadWriteMany): every volume gets a Haify NFS gateway
# with an address from nfsServiceIPs, and Pods on any node mount it. Write the
# range with the prefix length of its network, and keep the addresses free of
# other uses. See "Shared filesystems (ReadWriteMany)" in README.md.
# ---
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: haify-shared
# provisioner: haify.csi.liliang-cn.com
# parameters:
#   pool: "vg0"
#   replicas: "2"
#   sharedFilesystem: "nfs"
#   nfsServiceIPs: "192.168.1.200-192.168.1.220/24"
# reclaimPolicy: Delete
# allowVolumeExpansion: true
# volumeBindingMode: Immediate
