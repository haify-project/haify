# The Haify controller this cluster's volumes come from. It runs on the storage
# servers, outside Kubernetes: give the IP it answers on, which with Self-HA is
# its floating IP (`haify ha self status`). Required.
controller:
  address: ""            # e.g. 192.168.1.10
  port: 3374

# API token, when the controller has [auth] or [rbac] on. Either name a Secret
# you created (key "token"), or give the token and the chart creates one.
token:
  existingSecret: ""
  value: ""

image:
  repository: haify-csi
  tag: latest
  pullPolicy: IfNotPresent

sidecars:
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
  # v2 changes volumes through VolumeAttributesClasses on Kubernetes 1.34+;
  # on older clusters it only resizes.
  resizer: registry.k8s.io/sig-storage/csi-resizer:v2.0.0
  snapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
  livenessProbe: registry.k8s.io/sig-storage/livenessprobe:v2.14.0
  nodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0

# The kubelet's directory on the nodes; change it only for distributions that
# move it (e.g. microk8s: /var/snap/microk8s/common/var/lib/kubelet).
kubeletDir: /var/lib/kubelet

# Seconds a provisioning, resize or snapshot call may take. Creating a
# replicated volume runs over SSH on the storage nodes and can take a while.
operationTimeout: 120s

# One StorageClass per entry. pool is the Haify pool; replicas the number of
# copies. Any other parameters the driver takes go in parameters.
storageClasses:
  - name: haify
    default: false
    pool: vg0
    replicas: 2
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters: {}
  # Encrypted volumes: LUKS2 beneath DRBD on every replica (encryption: LVM
  # pools only), and kernel TLS on the DRBD connections (replicationTLS: run
  # `haify replication-tls setup` first). Each node keeps its own keys; nothing
  # is stored in Kubernetes. See deploy/k8s/README.md, "Encrypted volumes".
  # - name: haify-encrypted
  #   pool: vg0
  #   replicas: 2
  #   parameters:
  #     encryption: "true"
  #     replicationTLS: "true"
  # A class whose volumes also get an asynchronous replica on a Haify node at
  # another site. drNode must host the pool; drEndpoint is the DR site's
  # public address, without a port.
  # - name: haify-dr
  #   pool: vg0
  #   replicas: 2
  #   parameters:
  #     drNode: dr1
  #     drEndpoint: dr.example.com

# VolumeAttributesClasses (Kubernetes 1.34+). Naming one in a PVC's
# volumeAttributesClassName changes that volume in place. Parameters:
# replicas, resourceProfile, readIOPS, writeIOPS, readBytesPerSecond,
# writeBytesPerSecond ("max" lifts a limit). See the chart README.
volumeAttributesClasses: []
#  - name: haify-three-copies
#    parameters:
#      replicas: "3"
#  - name: haify-throttled
#    parameters:
#      readIOPS: "2000"
#      writeIOPS: "1000"
#      writeBytesPerSecond: "100Mi"

# A VolumeSnapshotClass, created only when the cluster has the snapshot CRDs
# (kubernetes-csi/external-snapshotter); k3s and most distributions do not ship
# them.
snapshotClass:
  enabled: true
  name: haify-snapshot
  default: false
  deletionPolicy: Delete
  # backupTarget (a Haify backup target) also uploads every snapshot there;
  # keepLocalSnapshot: "false" then deletes the local one once uploaded.
  parameters: {}
  #   backupTarget: offsite
  #   keepLocalSnapshot: "true"

# Moves Pods off a node that has died without waiting the five minutes
# Kubernetes takes: when the node drops out of a volume's DRBD resource and the
# other replicas keep quorum, it is tainted haify.csi/lost-quorum:NoSchedule
# and the Pods there using the volume are force-deleted, so their StatefulSet or
# Deployment recreates them on a node with a replica.
haFailover:
  enabled: true
  interval: 5s          # how often volumes in use are checked
  grace: 10s            # how long a node Kubernetes still calls Ready must look lost first
  maxLostFraction: 0.5  # do nothing while more than this share of nodes look lost

# Volume group snapshots: several PVCs snapshotted at one instant
# (VolumeGroupSnapshot). They need the group snapshot CRDs and a
# snapshot-controller started with --feature-gates=CSIVolumeGroupSnapshot=true,
# from the same external-snapshotter release as sidecars.snapshotter. "auto"
# turns the snapshotter's gate on, and creates the class, only when the cluster
# serves apiVersion: with the gate on and the CRDs missing, the sidecar stops
# handling ordinary VolumeSnapshots too.
groupSnapshots:
  enabled: auto          # auto, true or false
  # What sidecars.snapshotter speaks: groupsnapshot.storage.k8s.io/v1beta1 for
  # external-snapshotter v8.2 and v8.3, v1beta2 for v8.4 and v8.5, v1 from v8.6.
  apiVersion: groupsnapshot.storage.k8s.io/v1beta1
  className: haify-group-snapshot
  default: false
  deletionPolicy: Delete

controllerPlugin:
  # Two, so a node failure that takes one replica down leaves the other to take
  # over its Leases: the HA failover controller runs in this pod, and with a
  # single replica on the node that died it would wait out Kubernetes' five
  # minutes like any other pod. Each replica needs a node of its own; on a
  # single-node cluster set 1.
  replicas: 2
  nodeSelector: {}
  # Leave a dead node after 10s rather than Kubernetes' default 300s.
  tolerations:
    - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
    - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 10 }
  resources: {}

nodePlugin:
  # How often the node plugin re-reads the I/O limits of the volumes it has
  # published, so a VolumeAttributesClass change reaches running Pods; "0s"
  # applies limits only when a volume is published.
  qosInterval: 30s
  # For nodes the controller cannot SSH into, such as RHCOS on OpenShift: the
  # plugin registers its node itself and configures DRBD there (in the host's
  # /etc/drbd.d), so the node can mount volumes as a diskless client. A node
  # the controller already reaches over SSH stays managed that way.
  localAgent: false
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources: {}

# OpenShift / MicroShift: let the plugins' service accounts use the privileged
# SCC. Detected from the cluster's APIs; set true to render it offline.
openshift:
  enabled: false

# Load the DRBD 9 kernel module on the nodes from Kubernetes, instead of
# installing drbd-dkms on each node. Off by default: a node that already has
# DRBD 9 needs none of this. See docs/kubernetes-drbd.md.
drbdModuleLoader:
  enabled: false
  # The oldest DRBD module Haify accepts. A node with this or newer loaded is
  # left as it is; the node plugin waits until a node has it.
  minVersion: "9.2.0"
  # The Piraeus loader image for the nodes' distribution (see the table in
  # docs/kubernetes-drbd.md); its tag is the DRBD version it loads.
  image:
    repository: quay.io/piraeusdatastore/drbd9-noble
    tag: v9.3.4
    pullPolicy: IfNotPresent
  # compile: build DRBD against the node's kernel headers (/usr/src).
  # shipped_modules: install a prebuilt module the image carries.
  # deps_only: load only the modules DRBD depends on, not DRBD.
  # Empty lets the loader choose (compile when /usr/src is mounted).
  how: compile
  # Write /etc/modprobe.d/haify-drbd-loader.conf on nodes where the loader
  # loads DRBD, so that drbdadm cannot load the distribution's DRBD 8.4 first.
  blockHostModule: true
  # After loading DRBD, run the node's haify-drbd-up.service, which brings its
  # Haify resources up (at boot it ran before DRBD was there).
  bringUpResources: true
  # The node plugin waits for DRBD minVersion before it serves volumes.
  waitInNodePlugin: true
  # A Secret with signing_key.pem and signing_key.x509, for nodes with Secure
  # Boot: the loader signs the module with it. The certificate must be
  # enrolled on every node (mokutil --import).
  signingKeySecret: ""
  extraEnv: []
  nodeSelector: {}
  tolerations:
    - operator: Exists
  resources: {}
  # One loader per distribution, when the nodes run more than one. Each entry
  # gets its own DaemonSet with its image on the nodes its nodeSelector picks:
  #   - name: noble
  #     image: quay.io/piraeusdatastore/drbd9-noble:v9.3.4
  #     nodeSelector: {feature.node.kubernetes.io/system-os_release.VERSION_ID: "24.04"}
  distros: []
  # OpenShift (or any cluster with the Kernel Module Management operator):
  # a KMM Module that builds and loads DRBD for each node kernel.
  kmm:
    enabled: false
    # Where KMM finds, or pushes after building, the kmod image for a kernel.
    # KMM fills in ${KERNEL_FULL_VERSION}. Required.
    containerImage: ""
    # The kernels this image is for (a regular expression).
    kernelRegexp: "^.+$"
    # Build the image in the cluster from the Dockerfile in the chart's
    # ConfigMap when containerImage does not exist yet.
    build:
      enabled: true
      drbdVersion: 9.3.4
      # The build stage. Empty: OpenShift's Driver Toolkit for the node
      # kernel (KMM fills in DTK_AUTO). Elsewhere, an image with gcc, make and
      # the headers of the kernel being built for.
      builderImage: ""
      # The final stage; needs kmod.
      baseImage: registry.access.redhat.com/ubi9/ubi-minimal:9.6
      # Replace the whole Dockerfile.
      dockerfile: ""
    # Secure Boot: Secrets holding the private key (key "key") and the
    # certificate (key "cert"); KMM signs the module with them.
    sign:
      keySecret: ""
      certSecret: ""
    # Pull (and, for the build, push) credentials for containerImage.
    imageRepoSecret: ""
    selector:
      node-role.kubernetes.io/worker: ""
    tolerations: []
    # In-tree modules KMM unloads first, e.g. [drbd] on a kernel that ships
    # DRBD 8.4.
    inTreeModulesToRemove: []
