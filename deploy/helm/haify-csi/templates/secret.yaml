{{- if and .Values.token.value (not .Values.token.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: haify-api-token
  namespace: {{ .Release.Namespace }}
  labels: {{- include "haify-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token.value | quote }}
{{- end }}
