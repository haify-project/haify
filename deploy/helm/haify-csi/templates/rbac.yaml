apiVersion: v1
kind: ServiceAccount
metadata: { name: haify-csi-controller, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: haify-csi-node, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-provisioner }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-provisioner }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: haify-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-snapshotter }
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-snapshotter }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: haify-csi-snapshotter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-resizer }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-resizer }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: haify-csi-resizer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-health }
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-health }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: haify-csi-health
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.haFailover.enabled }}
# The plugin's HA controller: watches nodes, this driver's PVs and the Pods
# using them; taints a lost node, force-deletes its Pods so they are recreated
# elsewhere, deletes their VolumeAttachments, and posts events saying so.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: haify-csi-ha-failover }
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: haify-csi-ha-failover }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: haify-csi-ha-failover
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Leader election: the provisioner, resizer, snapshotter and the plugin's
# health reporter and HA controller each keep a Lease here, so only one replica
# acts at a time.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: haify-csi-leader-election, namespace: {{ .Release.Namespace }} }
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: haify-csi-leader-election, namespace: {{ .Release.Namespace }} }
subjects:
  - kind: ServiceAccount
    name: haify-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: haify-csi-leader-election
  apiGroup: rbac.authorization.k8s.io
