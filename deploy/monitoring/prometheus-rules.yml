# Prometheus alerting rules for a Haify controller's /metrics endpoint
# ([metrics] enabled = true in controller.toml). The controller raises its own
# events too (haify event list); these are for clusters already watched by
# Prometheus and Alertmanager.
groups:
  - name: haify
    rules:
      - alert: HaifyControllerDown
        expr: up{job="haify"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Haify controller {{ $labels.instance }} is not answering"

      - alert: HaifyObservationStale
        expr: time() - haify_controller_last_observation_timestamp_seconds > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Haify has not read {{ $labels.source }} for over 10 minutes; its series are frozen"

      - alert: HaifyNodeUnreachable
        expr: haify_controller_node_reachable == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Haify cannot reach node {{ $labels.node }}"

      - alert: HaifyQuorumLost
        expr: haify_drbd_quorum == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.resource }} on {{ $labels.node }} has lost quorum: I/O there is suspended or failing"

      - alert: HaifyResourceUnreadable
        expr: haify_drbd_resource_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "No node answered for resource {{ $labels.resource }}"

      - alert: HaifyReplicaNotUpToDate
        expr: haify_drbd_disk_state{state!~"UpToDate|Diskless"} == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.resource }} on {{ $labels.node }} is {{ $labels.state }}"

      - alert: HaifyOutOfSync
        expr: haify_drbd_out_of_sync_bytes > 0 and on (resource, node) haify_drbd_replication_state{state="Established"} == 1
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.resource }}: {{ $value | humanize1024 }}B on {{ $labels.node }} marked out of sync; run haify resource verify"

      - alert: HaifyThinPoolNearFull
        expr: haify_controller_pool_thin_used_percent > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Thin pool {{ $labels.pool }} on {{ $labels.node }} is {{ $value | printf \"%.1f\" }}% {{ $labels.kind }} used"

      - alert: HaifyThinPoolFull
        expr: haify_controller_pool_thin_used_percent > 95
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Thin pool {{ $labels.pool }} on {{ $labels.node }} is {{ $value | printf \"%.1f\" }}% {{ $labels.kind }} used: writes and resyncs are about to fail"

      - alert: HaifyBackupStale
        expr: time() - haify_controller_backup_last_success_timestamp_seconds > 2 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "No completed backup of {{ $labels.resource }} to {{ $labels.target }} for over two days"

      - alert: HaifyOneFailureDomain
        expr: haify_controller_resource_fault_domain_risk == 1
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "Losing {{ $labels.domain }} would take {{ $labels.resource }} down"

      - alert: HaifyNodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "node_exporter on {{ $labels.node }} is not answering; its memory, CPU and disk graphs are empty"

      - alert: HaifyNodeMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"} > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Node {{ $labels.node }} has used over 90% of its memory for 10 minutes"
