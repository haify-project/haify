# Haify AI Copilot — steward domain config.
#
# Read by haify-ai (cmd/haify-ai, path from HAIFY_AI_DOMAIN, default ai/domain.toml)
# and by ai/kb/build.sh (STEWARD_DOMAIN_FILE). Defines the Haify/DRBD persona, the
# ontology vocabulary, destructive-command red-lines, and read-only probes.
# Live cluster state comes from the `haify-mcp` tools (wired in cmd/haify-ai, not
# from this file); knowledge grounding comes from the cluster's knowledge base
# (HAIFY_AI_KNOWLEDGE_DB) and the shared one (HAIFY_AI_SHARED_KNOWLEDGE_DB).

name = "Haify storage/HA domain"
title = "Haify Copilot"

persona = '''
You are an expert SRE copilot for Haify, a DRBD-based software-defined storage
controller managing storage pools, DRBD resources, snapshots, HA (drbd-reactor
promoter configs + floating VIPs), and gateways (NFS / iSCSI / NVMe-oF) across a
Linux cluster.

How you work:
- Reason step by step (ReAct). When you need live cluster state, call the
  read-only haify tools (they are strictly read-only: list/status/health). Do not
  assume state you can observe.
- Be efficient with tools. Prefer the LIST tools that return everything in one
  call: `haify_ha_list` already returns every HA resource with its primary node,
  VIP, mount and status — call it ONCE for questions about HA resources. Do NOT
  call `haify_ha_status`/`haify_resource_status` per-resource in a loop; only drill
  into one resource when the list is insufficient for that specific resource.
  Never re-call a tool you already called with the same arguments.
- What the knowledge base holds, so you know what is worth asking it for. Two
  parts, searched together: the Haify shared base, identical on every cluster —
  Haify's documentation, its source as a graph (files, functions, classes and
  their calls/imports edges across pkg/controller, pkg/gateway, pkg/csi, cmd/*
  and the Proxmox plugin), the haify reference generated from
  the installed version's own --help, and the DRBD 9 manuals and LINBIT
  knowledge base; and this cluster's own notes — incidents on named machines
  and what was actually tried on them. The engine already requires searching
  before answering and forbids inventing an identifier — do not restate those
  rules here, and do not enumerate which topics deserve a search, which only
  teaches skipping the ones left off the list.
- Explain findings concretely in terms of the actual resources, nodes, promoter
  configs, and OCF start-list entries you observed.

Proposing changes (guarded):
- Day-to-day, non-destructive operations you run yourself with the haify write
  tools you have (create, add, start, mount, grow, set options, snapshot) and
  the haify_k8s_* tools for Kubernetes. The haify_* tools act on the bare-metal
  cluster through the controller; the haify_k8s_* tools act on Kubernetes objects
  (Deployments, PVCs) whose volumes Haify provides through CSI. Anything that deletes, restores, evicts, drains or stops is
  not in your toolset: for those, call the
  `suggest_action` tool with a structured proposal (action, params, reason,
  severity). The operator reviews and approves it in the UI; only then does the
  existing controller execute it.
- Prefer the smallest safe action. Give the reason and the expected effect.
- Use these EXACT action ids and params (the UI can only execute these):
    - "ha.evict"        params: {resource}                     — fail a resource's primary over to another node
    - "ha.create"       params: {resource, vip, mountPoint, fstype, services}
    - "snapshot.create" params: {volume, snapshotName, node}
  Propose exactly ONE action per turn unless asked for more; do not duplicate it.

Databases on Kubernetes (haify_k8s_app_create):
- When someone asks for a highly available MySQL or PostgreSQL "container" or
  "database", call `haify_k8s_app_create` directly; it is not a suggest_action. Pass
  only what they specified (template is "mysql" or "postgres"; name, namespace,
  size and storage_class are optional). It never overwrites: an existing app is
  an error, which you report rather than work around.
- Tell them what "HA" means here: one database pod whose volume DRBD replicates
  to a second node, with a tiebreaker on a third. If its node fails, Kubernetes
  restarts the pod on the other replica node after about 30 seconds plus the
  database's start-up, with every committed write intact. It is storage
  failover, not database replication, so the database is briefly down.
- Afterwards give the connection address (<name>.<namespace>.svc and port) and
  say the password is in the Secret <name>-auth. `haify_k8s_app_list` shows where each
  app runs and which DRBD resource holds its data.

Safety (non-negotiable):
- A deterministic red-line wall, independent of you, flags data-destroying
  operations (wipefs, dd to a device, mkfs, lvremove/vgremove, zfs/zpool destroy,
  and destructive Haify verbs like deleting a pool/resource/gateway). Never present
  such an operation as a one-liner to run; explain the risk, the affected
  volumes, and the backup precondition, and defer to explicit operator approval.
'''

# ---------------------------------------------------------------------------
# Ontology. Both lists go into the extraction prompt verbatim — "Use ONLY these
# entity types" / "Use ONLY these relation types" — once per ingested chunk, and
# nothing downstream reconciles one chunk's vocabulary with the next one's. So
# the vocabulary has to be closed here or it is not closed at all: eight
# paragraphs about the same failover become eight private spellings of it, and a
# graph whose edges are spelled six ways is a graph nobody can walk.
#
# The lists are not only a prompt. Every entity type below is registered with
# cortexdb as an object type implementing one `DomainEntity` interface, and that
# interface is what retrieval asks for: a node whose type is declared here is
# offered as a graph seed before an imported code node, and takes a neighbour
# slot before one. A type NOT declared here — invented by the extracting model,
# or imported from the Haify code graph — is still stored and still reachable,
# just behind. `/ai/kb/doctor` names the invented ones; a live base carried a
# "StorageClass" nobody declared for months without anyone noticing.
#
# Naming follows the RDF/schema.org split of classes from predicates: node types
# PascalCase, edge types lower_snake. The edge half is not a style choice — see
# the relation_types note below.
#
# Node types are the things an operator names in a sentence: the storage stack
# (node → pool → resource → volume → replica), the things that protect it
# (snapshots, schedules, backups, targets), the things that serve it (gateways,
# promoter configs, OCF agents, VIPs), and the things you read when it breaks
# (states, events, error strings, config parameters, CLI commands). What is
# deliberately NOT a type here is any *variant* of one: a pool's lvm/lvm-thin/zfs
# kind, a gateway's NFS/iSCSI/NVMe-oF protocol, a replica's Primary/Secondary
# role or its diskless tiebreaker duty. Those are properties of an instance, and
# promoting them would both grow this list with every enum Haify gains and force
# the model to choose between two types that mean the same thing. "Cluster" is
# gone for the opposite reason: there is one, every chunk is about it, so it
# became a hub that connected everything and distinguished nothing.
entity_types = [
  "Node", "StoragePool", "BlockDevice", "DRBDResource", "Volume", "Replica",
  "Snapshot", "SnapshotSchedule", "Backup", "BackupTarget",
  "Gateway", "HAConfig", "PromoterConfig", "OCFAgent", "VIP",
  "WANTunnel", "LUKSContainer",
  "Event", "NotificationChannel", "RBACRole",
  "SystemdService", "Package", "KernelModule",
  "ConfigParameter", "CLICommand", "State", "ErrorCode",
]

# Edges are chosen for what we want to walk when answering an operator, not for
# everything the docs can express: what backs this resource, which node exports
# this gateway, what protects it, what this state means and what clears it.
#
# THIS LIST IS the expansion whitelist. `knowledge_search` retrieves, then
# expands one hop along the edge types declared here, case-widened so the
# extractor's approximation of the declared spelling still matches. Every row
# below is walked, not just the first.
#
# It was not always so. Expansion used to filter on a FIXED list built into
# the engine — calls, contains, depends_on, inherits, implements, triggers,
# deploys, related — compared by exact string equality, and an edge outside it
# was never followed. That is why the original SCREAMING_SNAKE set produced a
# graph that looked populated and expanded to nothing: DEPLOYED_ON is not
# deploys. The first row is still spelled to land inside that built-in list,
# which costs nothing and keeps the graph walkable by a copilot pinned to an
# older steward. calls/inherits/implements are left to the C sources already
# in the knowledge base, since nothing in a storage doc inherits.
#
# Adding a row here does NOT make the edges already in the graph appear: they
# were extracted under whichever vocabulary was in force at ingest, and
# `/ai/kb/doctor` reports when the two have parted ways. Changing a spelling
# means re-ingesting the sources that used it.
relation_types = [
  "contains", "depends_on", "deploys", "triggers", "related",
  "backs", "exports", "promotes", "replicates_to", "protects", "stored_on",
  "caches", "notifies", "resolves", "configured_by", "conflicts_with",
  "has_state",
]

#
# Four of these also declare what sits on each end — see the [[relation]] blocks
# further down, which have to live below every top-level key in this file.

# Regex sources (TOML literal strings preserve backslashes). Group 1 = message.
# Mine the log/error string literals an operator actually sees, so a real error
# line can be traced back to its source.
error_patterns = [
  '(?:printk|pr_err|pr_warn|pr_crit|dev_err|dev_warn)\s*\([^"]*"([^"]{8,})"',
  'fprintf\s*\(\s*stderr\s*,\s*"([^"]{8,})"',
  '\blog_(?:err|error|warn|warning|crit)\s*\([^"]*"([^"]{8,})"',
  '\bperror\s*\(\s*"([^"]{6,})"',
  # Go: what Haify writes at info level and above, through any logger
  # (m.logger.Warn, zap.L().Error, log.Info), and the errors it returns. Not
  # zap.String("key", ...) and its kin: their first argument is a field name.
  # Not Debug: those traces begin with their function's name already and are
  # not what an operator sees at the default level.
  '\.(?:Info|Warn|Error|Fatal|Panic|DPanic)\s*\(\s*"([^"]{8,})"',
  '\b(?:fmt\.Errorf|errors\.New)\s*\(\s*"([^"]{8,})"',
]

# The knowledge base is built by ai/kb/build.sh; no repos are ingested from here.
repos = []

# ---------------------------------------------------------------------------
# Relation ends. A [[relation]] says what may sit on each side of an edge type,
# which the flat relation_types list cannot.
#
# These blocks are BELOW every top-level key on purpose. In TOML a table header
# ends the top-level section, so a [[relation]] placed next to relation_types —
# where it reads best — silently swallows error_patterns and repos into itself.
# Nothing fails: they load as keys of a relation nobody reads, and the domain
# comes up with zero error patterns.
#
# Two things read the ends. The ontology registers them as the link's two sides,
# and cortexdb decides a traversal's DIRECTION by keeping only nodes of the far
# side's type — so "exports" and "exports_of" mean opposite things only for the
# relations below. And `/ai/kb/doctor` compares them against the edges actually
# in the graph: an extracted `backs` asserted from the resource to the pool is
# stored without complaint, reads as a fact, and is walked as one. Nothing in
# the answer says the arrow points the wrong way. This declaration is the only
# thing that can disagree with it.
#
# An end is one type or a list of them. A list becomes an ontology interface
# those types implement, which is how a relation polymorphic in one end — a
# Snapshot and a Backup both protect a Volume — is modelled without either
# declaring something false or leaving the relation without ends.
#
# What a list is NOT is a shrug. Every type in it is asserted to belong there,
# and a node type outside it is reported as misdirected exactly like a reversed
# edge. So the lists below are the types Haify actually puts on each end, not
# every type that could conceivably appear.
#
# The two ends must be disjoint or identical, never partly overlapping. An
# edge's direction is recovered by matching its endpoints against the two ends;
# disjoint ends decide it, identical ends make it a self-relation where either
# reading is the same statement, and partial overlap leaves an edge between two
# shared types matching both. `conflicts_with` below is the identical case.
#
# Still not declared: `contains`, `depends_on`, `deploys`, `triggers`,
# `related` and `caches`. The first five are the generic edges the extractor
# reaches for when nothing more specific fits, and their ends are whatever the
# paragraph happened to be about; `caches` has no settled meaning in Haify yet.
# Declaring ends is an assertion, and one made wrong makes doctor report drift
# that is not there — a warning that cries wolf is worse than none.
# ---------------------------------------------------------------------------

# NOT declared, deliberately: `backs`, `stored_on` and `exports` are CHAINS. A
# BlockDevice backs a StoragePool backs a DRBDResource; a Volume is stored on a
# StoragePool stored on a Node; a Node exports a Gateway exports a DRBDResource. The middle term is both a source and a target, so the two
# ends necessarily overlap without being identical — the one shape a link cannot
# have, because an edge between two middle terms would read both ways. The live
# graph holds 35 `backs` and 70 `stored_on` edges of exactly that middle form,
# which is how this was discovered rather than guessed. Declaring one link of
# the chain and calling the rest drift would report real data as broken.

# A drbd-reactor promoter config promotes a DRBD resource to Primary, and so
# does an operator running `haify ha evict` — 16 such edges are in the graph.
# The OCFAgent runs underneath and does not promote anything itself.
[[relation]]
name = "promotes"
# The graph disagreed with the first version of this and was right: `drbd-promote@haify-meta`
# promotes haify-meta, `Node: node1` promotes haify-meta, and drbd-reactor promotes resources.
# That is the language DRBD itself uses. SystemdService stays on the from end only —
# a promoter starting haify-ai.service is its start list, which `contains` already says.
from = ["PromoterConfig", "CLICommand", "Node", "SystemdService", "Package"]
to   = ["DRBDResource", "Volume"]

# An event is what fires; a channel is what it goes out on.
[[relation]]
name = "notifies"
from = "Event"
to   = "NotificationChannel"

# A snapshot, a backup or the schedule that produces them is what protects a
# volume. The Snapshot/Backup pair is why an end needs to be a list at all.
[[relation]]
name = "protects"
from = ["Snapshot", "Backup", "SnapshotSchedule", "LUKSContainer"]
to   = ["Volume", "DRBDResource"]

# A state belongs to the thing that is in it. This is the widest end in the
# file and still a real constraint: a Package or a CLICommand does not have a
# State, and an extracted `has_state` claiming otherwise is a mistake.
[[relation]]
name = "has_state"
from = ["DRBDResource", "Replica", "Volume", "Gateway", "HAConfig", "Node", "SystemdService", "KernelModule", "Backup"]
to   = ["State"]

# Configuration flows one way: the parameter configures the thing, never back.
[[relation]]
name = "configured_by"
# Half of this relation's uses fell outside the first from list, and reading them
# settled it: `StoragePool: vg0` IS configured by `--pool`, a CSI Volume by `--fstype`,
# an OCFAgent by `ip`. Nearly anything in an ops domain is configured by a parameter,
# so the from end is nearly the whole vocabulary — what the declaration is really for
# here is the to end and the direction, both of which still hold.
# ConfigParameter is deliberately absent: a parameter configured by another parameter
# is the model being vague, and drift should keep saying so.
from = ["DRBDResource", "Gateway", "HAConfig", "PromoterConfig", "SystemdService", "WANTunnel",
        "CLICommand", "Node", "Volume", "Replica", "StoragePool", "OCFAgent", "Package",
        "NotificationChannel", "BackupTarget", "BlockDevice"]
to   = ["ConfigParameter"]

# What clears an error. A command an operator runs, or a parameter they change.
[[relation]]
name = "resolves"
from = ["CLICommand", "ConfigParameter"]
to   = ["ErrorCode", "State"]

# Replication runs between replicas, across nodes. Both ends are the same set,
# which makes it a self-relation: "a replicates_to b" read backwards is the
# same fact about the same pair.
[[relation]]
name = "replicates_to"
from = ["Replica", "Node", "DRBDResource"]
to   = ["Replica", "Node", "DRBDResource"]
# Read by alchemy only (STEWARD_ALCHEMY_ADDR). Identical ends make this a
# self-relation for cortexdb's traversal, but alchemy asks a different question
# — may both directions be true at once? — and its default answer is no. A
# document saying node1 and node2 replicate to each other is then two sources
# contradicting each other, and alchemy withholds the WHOLE document's graph
# while ingest still reports success. Measured, not hypothetical.
both_ways = true

# Two things that cannot both hold. Same shape as replicates_to and same
# reason: a conflict is symmetric.
[[relation]]
name = "conflicts_with"
from = ["DRBDResource", "Gateway", "HAConfig", "ConfigParameter", "Replica"]
to   = ["DRBDResource", "Gateway", "HAConfig", "ConfigParameter", "Replica"]
# Same reason as replicates_to above: a conflict is symmetric, and without this
# alchemy reads the pair as a contradiction and drops the graph.
both_ways = true

# ---------------------------------------------------------------------------
# Code vocabulary — the admission list for `steward ingest-repo` and
# `steward import-graph`, which import an Understand-Anything
# knowledge-graph.json (AST + LLM analysis of a real repository). Deliberately separate from the prose vocabulary above: the
# prose lists are pasted into the LLM extractor's prompt, and telling a prose
# extractor it may emit `function` and `calls` invites it to invent code
# structure out of documentation. This list is consumed only by the importer,
# which REFUSES a whole graph containing any type not declared here — so if
# Understand-Anything grows a new type, the import fails loudly with a
# histogram naming it, and the fix is one line below.
#
# The lists are Understand-Anything's own unions (packages/core/src/types.ts,
# v2.8.1). lower_snake, matching what a deterministic extractor emits; the
# case split against the prose vocabulary is what keeps "a file contains a
# function" from merging with "a cluster contains a node".
# ---------------------------------------------------------------------------

[vocabulary.code]
resolution = "syntactic" # name matching over a parse tree; Go `implements` is a guess
entity_types = [
  "file", "function", "class", "module", "concept",
  "config", "document", "service", "table", "endpoint",
  "pipeline", "schema", "resource",
  "domain", "flow", "step",
  "article", "entity", "topic", "claim", "source",
]
relation_types = [
  # structural
  "imports", "exports", "contains", "inherits", "implements",
  # behavioral
  "calls", "subscribes", "publishes", "middleware",
  # data flow
  "reads_from", "writes_to", "transforms", "validates",
  # dependencies
  "depends_on", "tested_by", "configures",
  # semantic
  "related", "similar_to",
  # infrastructure
  "deploys", "serves", "provisions", "triggers",
  # schema/data
  "migrates", "documents", "routes", "defines_schema",
  # domain
  "contains_flow", "flow_step", "cross_domain",
  # knowledge
  "cites", "contradicts", "builds_on", "exemplifies", "categorized_under", "authored_by",
]

# ---------------------------------------------------------------------------
# Deterministic destructive-command red-lines (LLM-independent). Applied to the
# string form of a suggested action / any command, before an operator can approve.
# ---------------------------------------------------------------------------

[[red_lines]]
id = "wipefs"
severity = "CRITICAL"
pattern = '\bwipefs\b'
reason = "wipefs erases filesystem signatures; data irreversibly lost"

[[red_lines]]
id = "dd-to-device"
severity = "CRITICAL"
pattern = '\bdd\b.*\bof=/dev/'
reason = "dd to a block device overwrites raw disk data"

[[red_lines]]
id = "mkfs"
severity = "CRITICAL"
pattern = '\bmkfs(\.\w+)?\b'
reason = "mkfs rebuilds a filesystem, wiping the target device"

[[red_lines]]
id = "lvremove"
severity = "CRITICAL"
pattern = '\blvremove\b'
reason = "lvremove deletes a logical volume; data on it is lost"

[[red_lines]]
id = "vgremove"
severity = "CRITICAL"
pattern = '\bvgremove\b'
reason = "vgremove deletes a volume group"

[[red_lines]]
id = "zfs-destroy"
severity = "CRITICAL"
pattern = '\bzfs\b.*\bdestroy\b'
reason = "zfs destroy deletes a dataset/volume/snapshot"

[[red_lines]]
id = "zpool-destroy"
severity = "CRITICAL"
pattern = '\bzpool\b.*\bdestroy\b'
reason = "zpool destroy destroys an entire storage pool"

[[red_lines]]
id = "drbdadm-wipe-md"
severity = "CRITICAL"
pattern = '\bdrbdadm\b.*\b(wipe-md|create-md)\b'
reason = "wipe-md/create-md rewrites DRBD metadata; can lose the replica"

# Destructive Haify control verbs. These map to controller operations that delete
# managed objects — recoverable only from backups/snapshots, so flag before approve.
[[red_lines]]
id = "haify-pool-delete"
severity = "HIGH"
pattern = '\bpool[._-]?delete\b'
reason = "deleting a storage pool destroys its volumes"

[[red_lines]]
id = "haify-resource-delete"
severity = "HIGH"
pattern = '\bresource[._-]?delete\b'
reason = "deleting a DRBD resource tears down replication and its backing volumes"

[[red_lines]]
id = "haify-ha-delete"
severity = "HIGH"
pattern = '\bha[._-]?delete\b'
reason = "deleting an HA config removes the promoter and floating VIP failover"

[[red_lines]]
id = "haify-gateway-delete"
severity = "HIGH"
pattern = '\bgateway[._-]?delete\b'
reason = "deleting a gateway stops exporting the storage (NFS/iSCSI/NVMe-oF)"

[[red_lines]]
id = "haify-snapshot-delete"
severity = "HIGH"
pattern = '\bsnapshot[._-]?delete\b'
reason = "deleting a snapshot discards a recovery point"

# ---------------------------------------------------------------------------
# Read-only probes (fallback situational awareness on the host running serve).
# Primary cluster state comes from the haify-mcp read tools; these are extra.
# ---------------------------------------------------------------------------

[[probes]]
name = "drbd_status"
description = "Show DRBD resource roles, connection and disk state."
argv = ["drbdadm", "status"]

[[probes]]
name = "reactor_prom_list"
description = "List drbd-reactor promoter targets and which node holds each."
argv = ["drbd-reactorctl", "status"]

[[probes]]
name = "vgs"
description = "Show LVM volume groups and free space."
argv = ["vgs"]

[[probes]]
name = "zpool_status"
description = "Show ZFS pool health and device status."
argv = ["zpool", "status"]
