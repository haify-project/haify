syntax = "proto3";

package v1;

option go_package = "./;v1";

import "google/api/annotations.proto";

// Haify Controller Service
service HaifyController {
  // Pool operations
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse) {
    option (google.api.http) = { post: "/v1/pools"; body: "*"; };
  }
  rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse) {
    option (google.api.http) = { delete: "/v1/pools/{name}"; };
  }
  rpc GetPool(GetPoolRequest) returns (GetPoolResponse) {
    option (google.api.http) = { get: "/v1/pools/{name}"; };
  }
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse) {
    option (google.api.http) = { get: "/v1/pools"; };
  }
  // Storage upkeep: trimming, disks, and long-running storage jobs.
  rpc TrimPools(TrimPoolsRequest) returns (TrimPoolsResponse) {
    option (google.api.http) = { post: "/v1/storage/trim"; body: "*"; };
  }
  rpc ListPoolDisks(ListPoolDisksRequest) returns (ListPoolDisksResponse) {
    option (google.api.http) = { get: "/v1/storage/disks"; };
  }
  // ListNodeDisks lists the disks on the nodes and whether a pool can use
  // each one: empty, holding only old data, in a pool, or in use.
  rpc ListNodeDisks(ListNodeDisksRequest) returns (ListNodeDisksResponse) {
    option (google.api.http) = { get: "/v1/storage/node-disks"; };
  }
  rpc RemovePoolDisk(RemovePoolDiskRequest) returns (StorageJobResponse) {
    option (google.api.http) = { post: "/v1/storage/disks/remove"; body: "*"; };
  }
  rpc ReplacePoolDisk(ReplacePoolDiskRequest) returns (StorageJobResponse) {
    option (google.api.http) = { post: "/v1/storage/disks/replace"; body: "*"; };
  }
  rpc MoveVolume(MoveVolumeRequest) returns (StorageJobResponse) {
    option (google.api.http) = { post: "/v1/storage/volumes/move"; body: "*"; };
  }
  rpc ListStorageJobs(ListStorageJobsRequest) returns (ListStorageJobsResponse) {
    option (google.api.http) = { get: "/v1/storage/jobs"; };
  }
  rpc AddDiskToPool(AddDiskToPoolRequest) returns (AddDiskToPoolResponse) {
    option (google.api.http) = { post: "/v1/pools/{pool}/disks"; body: "*"; };
  }

  // Node operations
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes"; body: "*"; };
  }
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse) {
    option (google.api.http) = { delete: "/v1/nodes/{address}"; };
  }
  rpc SetNodeLabels(SetNodeLabelsRequest) returns (SetNodeLabelsResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/labels"; body: "*"; };
  }
  rpc SetNodeAddress(SetNodeAddressRequest) returns (SetNodeAddressResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/address"; body: "*"; };
  }
  // SetNodeReplicationPaths sets the further addresses DRBD may use for a
  // node and rewrites every resource it takes part in.
  rpc SetNodeReplicationPaths(SetNodeReplicationPathsRequest) returns (SetNodeAddressResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/replication-paths"; body: "*"; };
  }
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse) {
    option (google.api.http) = { get: "/v1/nodes/{address}"; };
  }
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = { get: "/v1/nodes"; };
  }
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = { get: "/v1/nodes/{node}/health"; };
  }

  // Resource operations
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = { post: "/v1/resources"; body: "*"; };
  }
  rpc AdoptResource(AdoptResourceRequest) returns (AdoptResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/adopt"; body: "*"; };
  }
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = { delete: "/v1/resources/{name}"; };
  }
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = { get: "/v1/resources/{name}"; };
  }
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option (google.api.http) = { get: "/v1/resources"; };
  }
  rpc CreateResourceProfile(CreateResourceProfileRequest) returns (CreateResourceProfileResponse) {
    option (google.api.http) = { post: "/v1/resource-profiles"; body: "*"; };
  }
  rpc GetResourceProfile(GetResourceProfileRequest) returns (GetResourceProfileResponse) {
    option (google.api.http) = { get: "/v1/resource-profiles/{name}"; };
  }
  rpc ListResourceProfiles(ListResourceProfilesRequest) returns (ListResourceProfilesResponse) {
    option (google.api.http) = { get: "/v1/resource-profiles"; };
  }
  rpc DeleteResourceProfile(DeleteResourceProfileRequest) returns (DeleteResourceProfileResponse) {
    option (google.api.http) = { delete: "/v1/resource-profiles/{name}"; };
  }
  rpc SetResourceProfileOptions(SetResourceProfileOptionsRequest) returns (SetResourceProfileOptionsResponse) {
    option (google.api.http) = { post: "/v1/resource-profiles/{name}/options"; body: "*"; };
  }
  rpc AdjustResourceProfile(AdjustResourceProfileRequest) returns (AdjustResourceProfileResponse) {
    option (google.api.http) = { post: "/v1/resource-profiles/{name}/adjust"; body: "*"; };
  }
  rpc GetResourceProfileMaxSize(GetResourceProfileMaxSizeRequest) returns (GetResourceProfileMaxSizeResponse) {
    option (google.api.http) = { get: "/v1/resource-profiles/{name}/max-size"; };
  }
  rpc SetResourceProfile(SetResourceProfileRequest) returns (SetResourceProfileResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/profile"; body: "*"; };
  }
  rpc AddVolume(AddVolumeRequest) returns (AddVolumeResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes"; body: "*"; };
  }
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/volumes/{volume_id}"; };
  }
  // Renames a resource that nothing else refers to by name: offline (not
  // Primary anywhere), with no HA config, gateway, schedule, backups or
  // snapshots, not WAN-replicated or encrypted. Its data, node ids and port
  // are kept. The Proxmox plugin uses it to reassign disks and make templates.
  // Resource snapshots: every volume on every diskful replica, taken with
  // I/O suspended across them, so a rollback restores all replicas together
  // and resyncs nothing. Backing snapshots are "<backing>_snap_<name>".
  rpc CreateResourceSnapshot(CreateResourceSnapshotRequest) returns (CreateResourceSnapshotResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/snapshots"; body: "*"; };
  }
  rpc ListResourceSnapshots(ListResourceSnapshotsRequest) returns (ListResourceSnapshotsResponse) {
    option (google.api.http) = { get: "/v1/resources/{resource}/snapshots"; };
  }
  rpc RollbackResourceSnapshot(RollbackResourceSnapshotRequest) returns (RollbackResourceSnapshotResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/snapshots/{name}/rollback"; body: "*"; };
  }
  rpc DeleteResourceSnapshot(DeleteResourceSnapshotRequest) returns (DeleteResourceSnapshotResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/snapshots/{name}"; };
  }
  rpc RenameResource(RenameResourceRequest) returns (RenameResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/rename"; body: "*"; };
  }
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse) {
    option (google.api.http) = { patch: "/v1/resources/{resource}/volumes/{volume_id}"; body: "*"; };
  }
  rpc UpdateResourceOptions(UpdateResourceOptionsRequest) returns (UpdateResourceOptionsResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/options"; body: "*"; };
  }
  // Brings every participant's copy of a resource's DRBD config back into
  // agreement, tiebreakers and diskless clients included, and applies it.
  rpc RepairResource(RepairResourceRequest) returns (RepairResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/repair"; body: "*"; };
  }
  rpc ResourceStatus(ResourceStatusRequest) returns (ResourceStatusResponse) {
    option (google.api.http) = { get: "/v1/resources/{name}/status"; };
  }
  rpc SetPrimary(SetPrimaryRequest) returns (SetPrimaryResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/primary"; body: "*"; };
  }
  rpc SetSecondary(SetSecondaryRequest) returns (SetSecondaryResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/secondary"; body: "*"; };
  }
  rpc SetDualPrimary(SetDualPrimaryRequest) returns (SetDualPrimaryResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/dual-primary"; body: "*"; };
  }
  rpc AttachDisklessClient(AttachDisklessClientRequest) returns (AttachDisklessClientResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/diskless-clients"; body: "*"; };
  }
  rpc DetachDisklessClient(DetachDisklessClientRequest) returns (DetachDisklessClientResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/diskless-clients/{node}"; };
  }
  // Labels on a resource: the keys in labels are set, then the keys in remove
  // are deleted. Integrations mark what they run on a resource this way, e.g.
  // haify.libvirt/domain=<guest>.
  rpc SetResourceLabels(SetResourceLabelsRequest) returns (SetResourceLabelsResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/labels"; body: "*"; };
  }
  rpc CreateFilesystem(CreateFilesystemRequest) returns (CreateFilesystemResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/filesystem"; body: "*"; };
  }
  rpc MountResource(MountResourceRequest) returns (MountResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/mount"; body: "*"; };
  }
  rpc UnmountResource(UnmountResourceRequest) returns (UnmountResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/volumes/{volume_id}/unmount"; body: "*"; };
  }
  rpc MakeHa(MakeHaRequest) returns (MakeHaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha"; body: "*"; };
  }
  rpc EvictHa(EvictHaRequest) returns (EvictHaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha/evict"; body: "*"; };
  }
  // Orders where drbd-reactor starts an HA resource (preferred-nodes). A
  // preference, not a fence; DRBD quorum is what prevents split brain.
  rpc SetHaPreferredNodes(SetHaPreferredNodesRequest) returns (SetHaPreferredNodesResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha/preferred-nodes"; body: "*"; };
  }
  rpc SetTiebreaker(SetTiebreakerRequest) returns (SetTiebreakerResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/ha/tiebreaker"; body: "*"; };
  }
  // Encrypted DRBD replication: prepare nodes (key, certificate from the
  // controller's replication CA, tlshd), report their readiness, and switch a
  // resource's connections over one link at a time.
  rpc SetupReplicationTLS(SetupReplicationTLSRequest) returns (ReplicationTLSResponse) {
    option (google.api.http) = { post: "/v1/replication-tls/setup"; body: "*"; };
  }
  rpc GetReplicationTLSStatus(GetReplicationTLSStatusRequest) returns (ReplicationTLSResponse) {
    option (google.api.http) = { get: "/v1/replication-tls" };
  }
  rpc SetResourceTLS(SetResourceTLSRequest) returns (SetResourceTLSResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/tls"; body: "*"; };
  }
  rpc AddDR(AddDRRequest) returns (AddDRResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/dr"; body: "*"; };
  }
  rpc AddReplica(AddReplicaRequest) returns (AddReplicaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/replicas"; body: "*"; };
  }
  rpc RemoveReplica(RemoveReplicaRequest) returns (RemoveReplicaResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/replicas/{node}"; };
  }
  rpc DeleteHa(DeleteHaRequest) returns (DeleteHaResponse) {
    option (google.api.http) = { delete: "/v1/resources/{resource}/ha"; };
  }
  rpc GetHa(GetHaRequest) returns (GetHaResponse) {
    option (google.api.http) = { get: "/v1/resources/{resource}/ha"; };
  }
  rpc ListHa(ListHaRequest) returns (ListHaResponse) {
    option (google.api.http) = { get: "/v1/ha"; };
  }

  rpc GetHaStatus(GetHaStatusRequest) returns (GetHaStatusResponse) {
    option (google.api.http) = { get: "/v1/ha/{resource}/status"; };
  }


  // HA OCF resource-agent discovery and drbd-reactor promoter TOML editing.
  rpc ListResourceAgents(ListResourceAgentsRequest) returns (ListResourceAgentsResponse) {
    option (google.api.http) = { get: "/v1/ha/resource-agents"; };
  }
  rpc GetResourceAgentMetadata(GetResourceAgentMetadataRequest) returns (GetResourceAgentMetadataResponse) {
    option (google.api.http) = { get: "/v1/ha/resource-agents/{provider}/{name}"; };
  }
  rpc GetHaToml(GetHaTomlRequest) returns (GetHaTomlResponse) {
    option (google.api.http) = { get: "/v1/ha/{resource}/toml"; };
  }
  rpc SyncHaToml(SyncHaTomlRequest) returns (SyncHaTomlResponse) {
    option (google.api.http) = { post: "/v1/ha/{resource}/toml"; body: "*"; };
  }

  // Controller self-HA operations: make the controller itself highly
  // available on its own DRBD + drbd-reactor machinery.
  rpc EnableSelfHa(EnableSelfHaRequest) returns (EnableSelfHaResponse) {
    option (google.api.http) = { post: "/v1/selfha/enable"; body: "*"; };
  }
  rpc DisableSelfHa(DisableSelfHaRequest) returns (DisableSelfHaResponse) {
    option (google.api.http) = { post: "/v1/selfha/disable"; body: "*"; };
  }
  rpc GetSelfHaStatus(GetSelfHaStatusRequest) returns (GetSelfHaStatusResponse) {
    option (google.api.http) = { get: "/v1/selfha"; };
  }

  // Snapshot operations. Volume identifiers are "<pool>/<lv>" paths, so the
  // REST bindings need the two-segment pattern {volume=*/*}; a plain
  // {volume} never matches a value containing a slash. The single-segment
  // binding is kept for backward compatibility.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/volumes/{volume=*/*}/snapshots"; body: "*";
      additional_bindings { post: "/v1/volumes/{volume}/snapshots"; body: "*"; }
    };
  }
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {
    option (google.api.http) = {
      delete: "/v1/volumes/{volume=*/*}/snapshots/{snapshot_name}";
      additional_bindings { delete: "/v1/volumes/{volume}/snapshots/{snapshot_name}"; }
    };
  }
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/volumes/{volume=*/*}/snapshots/{snapshot_name}/restore"; body: "*";
      additional_bindings { post: "/v1/volumes/{volume}/snapshots/{snapshot_name}/restore"; body: "*"; }
    };
  }
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/volumes/{volume=*/*}/snapshots";
      additional_bindings { get: "/v1/volumes/{volume}/snapshots"; }
    };
  }
  // PopulateVolume copies a source block device (an LVM/ZFS snapshot, or another
  // resource's backing volume) into an ALREADY-CREATED, still-empty DRBD
  // resource. Unlike RestoreSnapshot — which merges a snapshot back into its own
  // origin in place — this fills a *different*, new volume, which is what CSI
  // restore-from-snapshot and volume cloning need.
  //
  // The copy is written to the target's DRBD device (not its backing LV) on a
  // node that holds a replica, so DRBD replicates it to every peer for free.
  rpc PopulateVolume(PopulateVolumeRequest) returns (PopulateVolumeResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/populate"; body: "*"; };
  }

  // Snapshot schedule operations (cron-driven snapshots + GFS retention)
  rpc CreateSnapshotSchedule(CreateSnapshotScheduleRequest) returns (CreateSnapshotScheduleResponse) {
    option (google.api.http) = { post: "/v1/snapshot-schedules"; body: "*"; };
  }
  rpc ListSnapshotSchedules(ListSnapshotSchedulesRequest) returns (ListSnapshotSchedulesResponse) {
    option (google.api.http) = { get: "/v1/snapshot-schedules"; };
  }
  rpc DeleteSnapshotSchedule(DeleteSnapshotScheduleRequest) returns (DeleteSnapshotScheduleResponse) {
    option (google.api.http) = { delete: "/v1/snapshot-schedules/{name}"; };
  }
  // Freezing a schedule keeps it snapshotting but stops all pruning, and locks
  // every scheduled snapshot of the resource until the freeze ends. The
  // write-anomaly detector freezes one when it fires. A freeze is only ever
  // extended by Freeze; Unfreeze ends it early.
  rpc FreezeSnapshotSchedule(FreezeSnapshotScheduleRequest) returns (FreezeSnapshotScheduleResponse) {
    option (google.api.http) = { post: "/v1/snapshot-schedules/{resource}/freeze"; body: "*"; };
  }
  rpc UnfreezeSnapshotSchedule(UnfreezeSnapshotScheduleRequest) returns (UnfreezeSnapshotScheduleResponse) {
    option (google.api.http) = { post: "/v1/snapshot-schedules/{resource}/unfreeze"; body: "*"; };
  }

  // Backup operations: shipping point-in-time copies OFF the cluster to an
  // S3-compatible object store, an SMB share or a WebDAV endpoint.
  //
  // Distinct from snapshots (same pool, lost with the machine) and from WAN DR
  // (a replica, where a delete replicates). After the first full image, a
  // backup of a thin volume is incremental: only blocks changed since the last
  // backup to the same target are shipped.
  rpc AddBackupTarget(AddBackupTargetRequest) returns (AddBackupTargetResponse) {
    option (google.api.http) = { post: "/v1/backup-targets"; body: "*"; };
  }
  rpc ListBackupTargets(ListBackupTargetsRequest) returns (ListBackupTargetsResponse) {
    option (google.api.http) = { get: "/v1/backup-targets"; };
  }
  rpc DeleteBackupTarget(DeleteBackupTargetRequest) returns (DeleteBackupTargetResponse) {
    option (google.api.http) = { delete: "/v1/backup-targets/{name}"; };
  }
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse) {
    option (google.api.http) = { post: "/v1/backups"; body: "*"; };
  }
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = { get: "/v1/backups"; };
  }
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse) {
    option (google.api.http) = { post: "/v1/backups/{id}/restore"; body: "*"; };
  }
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse) {
    option (google.api.http) = { delete: "/v1/backups/{id}"; };
  }
  // ImportBackups rebuilds backup records from the manifests on a target, for
  // a controller that lost its database or a cluster restoring another's.
  rpc ImportBackups(ImportBackupsRequest) returns (ImportBackupsResponse) {
    option (google.api.http) = { post: "/v1/backup-targets/{target}/import"; body: "*"; };
  }
  rpc CreateBackupSchedule(CreateBackupScheduleRequest) returns (CreateBackupScheduleResponse) {
    option (google.api.http) = { post: "/v1/backup-schedules"; body: "*"; };
  }
  rpc ListBackupSchedules(ListBackupSchedulesRequest) returns (ListBackupSchedulesResponse) {
    option (google.api.http) = { get: "/v1/backup-schedules"; };
  }
  rpc DeleteBackupSchedule(DeleteBackupScheduleRequest) returns (DeleteBackupScheduleResponse) {
    option (google.api.http) = { delete: "/v1/backup-schedules/{name}"; };
  }
  rpc RunBackupSchedule(RunBackupScheduleRequest) returns (RunBackupScheduleResponse) {
    option (google.api.http) = { post: "/v1/backup-schedules/{name}/run"; body: "*"; };
  }

  // Gateway operations
  rpc CreateNFSGateway(CreateNFSGatewayRequest) returns (CreateNFSGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs"; body: "*"; };
  }
  rpc CreateISCSIGateway(CreateISCSIGatewayRequest) returns (CreateISCSIGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi"; body: "*"; };
  }
  rpc CreateNVMeGateway(CreateNVMeGatewayRequest) returns (CreateNVMeGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme"; body: "*"; };
  }
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayResponse) {
    option (google.api.http) = { delete: "/v1/gateways/{id}"; };
  }
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayResponse) {
    option (google.api.http) = { get: "/v1/gateways/{id}"; };
  }
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse) {
    option (google.api.http) = { get: "/v1/gateways"; };
  }
  rpc StartGateway(StartGatewayRequest) returns (StartGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/{id}/start"; body: "*"; };
  }
  rpc StopGateway(StopGatewayRequest) returns (StopGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/{id}/stop"; body: "*"; };
  }
  rpc AddNFSExport(AddNFSExportRequest) returns (AddNFSExportResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:add"; body: "*"; };
  }
  rpc RemoveNFSExport(RemoveNFSExportRequest) returns (RemoveNFSExportResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:remove"; body: "*"; };
  }
  rpc ListNFSExports(ListNFSExportsRequest) returns (ListNFSExportsResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/exports:list"; body: "*"; };
  }
  // SMB gateway (workgroup edition): a standalone Samba server per resource,
  // its users and shares kept on the gateway's state volume.
  rpc CreateSMBGateway(CreateSMBGatewayRequest) returns (CreateSMBGatewayResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb"; body: "*"; };
  }
  rpc AddSMBShare(AddSMBShareRequest) returns (AddSMBShareResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/shares:add"; body: "*"; };
  }
  rpc RemoveSMBShare(RemoveSMBShareRequest) returns (RemoveSMBShareResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/shares:remove"; body: "*"; };
  }
  rpc ListSMBShares(ListSMBSharesRequest) returns (ListSMBSharesResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/shares:list"; body: "*"; };
  }
  rpc SetSMBUser(SetSMBUserRequest) returns (SetSMBUserResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/users:set"; body: "*"; };
  }
  rpc RemoveSMBUser(RemoveSMBUserRequest) returns (RemoveSMBUserResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/users:remove"; body: "*"; };
  }
  rpc ListSMBUsers(ListSMBUsersRequest) returns (ListSMBUsersResponse) {
    option (google.api.http) = { post: "/v1/gateways/smb/users:list"; body: "*"; };
  }
  rpc AddISCSILUN(AddISCSILUNRequest) returns (AddISCSILUNResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:add"; body: "*"; };
  }
  rpc RemoveISCSILUN(RemoveISCSILUNRequest) returns (RemoveISCSILUNResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:remove"; body: "*"; };
  }
  rpc ListISCSILUNs(ListISCSILUNsRequest) returns (ListISCSILUNsResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/luns:list"; body: "*"; };
  }
  rpc AddISCSIInitiator(AddISCSIInitiatorRequest) returns (AddISCSIInitiatorResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:add"; body: "*"; };
  }
  rpc RemoveISCSIInitiator(RemoveISCSIInitiatorRequest) returns (RemoveISCSIInitiatorResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:remove"; body: "*"; };
  }
  rpc ListISCSIInitiators(ListISCSIInitiatorsRequest) returns (ListISCSIInitiatorsResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/initiators:list"; body: "*"; };
  }
  rpc SetISCSIChap(SetISCSIChapRequest) returns (SetISCSIChapResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/chap:set"; body: "*"; };
  }
  rpc GetISCSIChap(GetISCSIChapRequest) returns (GetISCSIChapResponse) {
    option (google.api.http) = { post: "/v1/gateways/iscsi/chap:get"; body: "*"; };
  }
  rpc AddNVMeNamespace(AddNVMeNamespaceRequest) returns (AddNVMeNamespaceResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:add"; body: "*"; };
  }
  rpc RemoveNVMeNamespace(RemoveNVMeNamespaceRequest) returns (RemoveNVMeNamespaceResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:remove"; body: "*"; };
  }
  rpc ListNVMeNamespaces(ListNVMeNamespacesRequest) returns (ListNVMeNamespacesResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/namespaces:list"; body: "*"; };
  }
  rpc AddNVMeHost(AddNVMeHostRequest) returns (AddNVMeHostResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:add"; body: "*"; };
  }
  rpc RemoveNVMeHost(RemoveNVMeHostRequest) returns (RemoveNVMeHostResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:remove"; body: "*"; };
  }
  rpc ListNVMeHosts(ListNVMeHostsRequest) returns (ListNVMeHostsResponse) {
    option (google.api.http) = { post: "/v1/gateways/nvme/hosts:list"; body: "*"; };
  }

  // ZFS operations
  rpc CreateZFSPool(CreateZFSPoolRequest) returns (CreateZFSPoolResponse) {
    option (google.api.http) = { post: "/v1/zfs/pools"; body: "*"; };
  }
  rpc DeleteZFSPool(DeleteZFSPoolRequest) returns (DeleteZFSPoolResponse) {
    option (google.api.http) = { delete: "/v1/zfs/pools/{name}"; };
  }
  // Listing ZFS pools was the one RPC in the ZFS pool CRUD triple with no HTTP
  // binding, so it was reachable over gRPC but absent from the REST API and
  // from the generated OpenAPI document. Create and Delete were both bound.
  rpc ListZFSpools(ListZFSPoolsRequest) returns (ListZFSPoolsResponse) {
    option (google.api.http) = { get: "/v1/zfs/pools"; };
  }
  rpc CreateZFSDataset(CreateZFSDatasetRequest) returns (CreateZFSDatasetResponse) {
    option (google.api.http) = { post: "/v1/zfs/datasets"; body: "*"; };
  }
  rpc CreateZFSVolume(CreateZFSVolumeRequest) returns (CreateZFSVolumeResponse) {
    option (google.api.http) = { post: "/v1/zfs/volumes"; body: "*"; };
  }
  rpc ResizeZFSVolume(ResizeZFSVolumeRequest) returns (ResizeZFSVolumeResponse) {
    option (google.api.http) = {
      patch: "/v1/zfs/volumes/{volume_path=*/*}"; body: "*";
      additional_bindings { patch: "/v1/zfs/volumes/{volume_path}"; body: "*"; }
    };
  }
  rpc DeleteZFSDataset(DeleteZFSDatasetRequest) returns (DeleteZFSDatasetResponse) {
    option (google.api.http) = {
      delete: "/v1/zfs/datasets/{dataset_path=*/*}";
      additional_bindings { delete: "/v1/zfs/datasets/{dataset_path}"; }
    };
  }

  // ZFS Snapshot operations
  // ZFS snapshot identifiers are "<pool>/<dataset>" (and
  // "<pool>/<dataset>@<snap>") paths; single-segment {param} patterns never
  // match values containing '/', so two-segment bindings come first.
  // Deeply nested datasets (pool/a/b) are not reachable over REST.
  rpc CreateZFSSnapshot(CreateZFSSnapshotRequest) returns (CreateZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/datasets/{dataset=*/*}/snapshots"; body: "*";
      additional_bindings { post: "/v1/zfs/datasets/{dataset}/snapshots"; body: "*"; }
    };
  }
  rpc DeleteZFSSnapshot(DeleteZFSSnapshotRequest) returns (DeleteZFSSnapshotResponse) {
    option (google.api.http) = {
      delete: "/v1/zfs/snapshots/{snapshot=*/*}";
      additional_bindings { delete: "/v1/zfs/snapshots/{snapshot}"; }
    };
  }
  rpc ListZFSSnapshots(ListZFSSnapshotsRequest) returns (ListZFSSnapshotsResponse) {
    option (google.api.http) = {
      get: "/v1/zfs/datasets/{dataset=*/*}/snapshots";
      additional_bindings { get: "/v1/zfs/datasets/{dataset}/snapshots"; }
    };
  }
  rpc RestoreZFSSnapshot(RestoreZFSSnapshotRequest) returns (RestoreZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/datasets/{dataset=*/*}/snapshots/{snapshot_name}/restore"; body: "*";
      additional_bindings { post: "/v1/zfs/datasets/{dataset}/snapshots/{snapshot_name}/restore"; body: "*"; }
    };
  }
  rpc CloneZFSSnapshot(CloneZFSSnapshotRequest) returns (CloneZFSSnapshotResponse) {
    option (google.api.http) = {
      post: "/v1/zfs/snapshots/{snapshot=*/*}/clone"; body: "*";
      additional_bindings { post: "/v1/zfs/snapshots/{snapshot}/clone"; body: "*"; }
    };
  }

  // LVM Snapshot operations
  rpc CreateLvmSnapshot(CreateLvmSnapshotRequest) returns (CreateLvmSnapshotResponse) {
    option (google.api.http) = { post: "/v1/lvm/volumes/{lv_name}/snapshots"; body: "*"; };
  }
  rpc DeleteLvmSnapshot(DeleteLvmSnapshotRequest) returns (DeleteLvmSnapshotResponse) {
    option (google.api.http) = { delete: "/v1/lvm/volumes/{lv_name}/snapshots/{snapshot_name}"; };
  }
  rpc ListLvmSnapshots(ListLvmSnapshotsRequest) returns (ListLvmSnapshotsResponse) {
    option (google.api.http) = { get: "/v1/lvm/volumes/{lv_name}/snapshots"; };
  }
  rpc RestoreLvmSnapshot(RestoreLvmSnapshotRequest) returns (RestoreLvmSnapshotResponse) {
    option (google.api.http) = { post: "/v1/lvm/volumes/{lv_name}/snapshots/{snapshot_name}/restore"; body: "*"; };
  }
  // Self-healing (see docs/user-guide.md "Self-healing"). MoveReplica adds
  // the new replica and removes the old one once the new one is UpToDate.
  // PlanRebalance proposes moves from the fullest node; apply runs them one
  // at a time. MarkNodeLost removes the replicas of a node that will not
  // return; RestoreNode cleans what a returned node holds of resources it is
  // no longer part of and lets it take replicas again.
  // Caps an NFS export directory with an ext4 project quota (gateways
  // created from this version on); size 0 removes the cap.
  rpc SetNFSExportQuota(SetNFSExportQuotaRequest) returns (SetNFSExportQuotaResponse) {
    option (google.api.http) = { post: "/v1/gateways/nfs/{resource}/quota"; body: "*"; };
  }
  rpc MoveReplica(MoveReplicaRequest) returns (MoveReplicaResponse) {
    option (google.api.http) = { post: "/v1/resources/{resource}/move-replica"; body: "*"; };
  }
  rpc PlanRebalance(PlanRebalanceRequest) returns (PlanRebalanceResponse) {
    option (google.api.http) = { post: "/v1/rebalance"; body: "*"; };
  }
  rpc MarkNodeLost(MarkNodeLostRequest) returns (MarkNodeLostResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/lost"; body: "*"; };
  }
  rpc RestoreNode(RestoreNodeRequest) returns (RestoreNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/restore"; body: "*"; };
  }
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{name}/drain"; };
  }
  rpc UndrainNode(UndrainNodeRequest) returns (UndrainNodeResponse) {
    option (google.api.http) = { post: "/v1/nodes/{name}/undrain"; };
  }
  // ConvertPoolToThin rebuilds one node's LVM pool as a thin pool, in place.
  // Thick pools cannot hold a snapshot history: each snapshot reserves a fixed
  // COW area whether anything changes or not.
  rpc ConvertPoolToThin(ConvertPoolToThinRequest) returns (ConvertPoolToThinResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/pools/{pool}/convert-thin"; };
  }

  // Storage tiering: put an SSD/NVMe device in front of one node's LVM pool
  // with lvmcache. The cache serves the whole pool, and defaults to
  // writethrough because a writeback cache holds acknowledged writes that no
  // other node has yet.
  rpc AddPoolCache(AddPoolCacheRequest) returns (AddPoolCacheResponse) {
    option (google.api.http) = { post: "/v1/nodes/{node}/pools/{pool}/cache"; body: "*"; };
  }
  rpc RemovePoolCache(RemovePoolCacheRequest) returns (RemovePoolCacheResponse) {
    option (google.api.http) = { delete: "/v1/nodes/{node}/pools/{pool}/cache"; };
  }

  // Audit trail: who called what, when, and whether it was allowed. Persisted
  // in the database, which lives on the controller's replicated volume, so the
  // history follows the controller across a failover instead of being split
  // across the journals of whichever nodes happened to be active.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option (google.api.http) = { get: "/v1/audit"; };
  }

  // The controller's own log output, from an in-memory ring buffer. Deliberately
  // not persisted: this is for watching what a running controller is doing, and
  // a controller that has moved has nothing useful to say about its old node.
  rpc ListControllerLogs(ListControllerLogsRequest) returns (ListControllerLogsResponse) {
    option (google.api.http) = { get: "/v1/logs"; };
  }

  // The journals and kernel messages the controller does not hold.
  //
  // ListControllerLogs above is the controller's own ring buffer, and almost
  // nothing that breaks DRBD appears in it: a promoter that could not start its
  // target, a resource that will not connect, a kernel that refused the module,
  // an LVM pool with no space left. Those are on the nodes, and until now the
  // only way to read them was for a person to ssh in.
  //
  // The collectors are a fixed table, named and read-only. This is deliberately
  // not a command channel: a request names collectors, never a command line, so
  // an unknown name is reported back and nothing is run. See
  // pkg/controller/diagnostics.go for the table and what each one reads.
  rpc CollectNodeDiagnostics(CollectNodeDiagnosticsRequest) returns (CollectNodeDiagnosticsResponse) {
    option (google.api.http) = { post: "/v1/diagnostics/collect"; body: "*"; };
  }

  // Operational notifications: a replica degraded, a resource's Primary moved,
  // a node stopped answering. ListEvents serves the controller's bounded
  // in-memory history — enough to see what just happened, not an archive. The
  // durable record of who did what is ListAuditEvents.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = { get: "/v1/events"; };
  }

  // Notification channels: where alerts are delivered. These live in the
  // controller database rather than in controller.toml so they can be changed
  // from the UI while the controller runs — reconfiguring alerting by editing a
  // file and restarting means a deliberate window with no alerting at all.
  //
  // A channel has a kind, because a chat service does not accept an arbitrary
  // JSON document: Feishu, Slack, WeCom and DingTalk each define their own
  // message envelope and reject anything else, and Feishu, WeCom and DingTalk
  // do it inside an HTTP 200.
  rpc ListNotifyChannels(ListNotifyChannelsRequest) returns (ListNotifyChannelsResponse) {
    option (google.api.http) = { get: "/v1/notify-channels"; };
  }
  rpc SaveNotifyChannel(SaveNotifyChannelRequest) returns (SaveNotifyChannelResponse) {
    option (google.api.http) = { post: "/v1/notify-channels"; body: "*"; };
  }
  rpc DeleteNotifyChannel(DeleteNotifyChannelRequest) returns (DeleteNotifyChannelResponse) {
    option (google.api.http) = { delete: "/v1/notify-channels/{name}"; };
  }
  // TestNotifyChannel delivers one synthetic message to a single channel and
  // reports what the far end actually said, including a rejection returned
  // inside a 200. It does not go through the event bus, so it neither pages the
  // other channels nor appears in the event history.
  rpc TestNotifyChannel(TestNotifyChannelRequest) returns (TestNotifyChannelResponse) {
    option (google.api.http) = { post: "/v1/notify-channels/{name}/test"; body: "*"; };
  }

  // Cluster inspection: deterministic checks of everything around the alerts —
  // replicas stuck mid-handshake, alerts that reach no channel, node clocks,
  // disks and addresses, pool growth, late backups, Self-HA readiness,
  // certificate expiry, leftovers. RunInspection runs one now and waits for
  // the report; it changes nothing on the cluster. A run already in progress
  // is not overlapped: the call fails instead.
  rpc RunInspection(RunInspectionRequest) returns (RunInspectionResponse) {
    option (google.api.http) = { post: "/v1/inspections"; body: "*"; };
  }
  // ListInspections lists stored reports, newest first, without their checks.
  rpc ListInspections(ListInspectionsRequest) returns (ListInspectionsResponse) {
    option (google.api.http) = { get: "/v1/inspections"; };
  }
  // GetInspection returns one stored report; id "latest" (or empty) is the
  // newest.
  rpc GetInspection(GetInspectionRequest) returns (GetInspectionResponse) {
    option (google.api.http) = { get: "/v1/inspections/{id}"; };
  }

  // RepairWanProxy reconciles a WAN resource's replication tunnels with what
  // the controller currently believes its nodes are: it re-provisions the legs
  // that should exist and removes instances left behind by a node that was
  // renumbered or removed. Safe to run on a healthy resource — it converges.
  rpc RepairWanProxy(RepairWanProxyRequest) returns (RepairWanProxyResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/wan/repair"; body: "*"; };
  }
  rpc DRFailback(DRFailbackRequest) returns (DRFailbackResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/wan/failback"; body: "*"; };
  }
  rpc SetWanEndpoint(SetWanEndpointRequest) returns (SetWanEndpointResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/wan/endpoint"; body: "*"; };
  }
  rpc VerifyResource(VerifyResourceRequest) returns (VerifyResourceResponse) {
    option (google.api.http) = { post: "/v1/resources/{name}/verify"; body: "*"; };
  }

  // WatchEvents streams notifications as they happen, so an operator (or the
  // web UI, or a script) can react without polling. Over REST this is a
  // newline-delimited JSON stream; `curl -N .../v1/events/watch` works.
  //
  // A watcher that cannot keep up loses events rather than blocking the
  // controller. Event.id is monotonic across the whole stream, so a gap in it
  // is how a client detects that it fell behind.
  rpc WatchEvents(WatchEventsRequest) returns (stream Event) {
    option (google.api.http) = { get: "/v1/events/watch"; };
  }

  // Role-based access control: the caller's identity, the effective policy,
  // and user management. gRPC only, so they share the API's transport
  // security; the web UI reaches the same operations through hand-written
  // REST routes under /v1/rbac. Policy listing and user changes require the
  // administrator role. Each returns enabled=false when [rbac] is off.
  rpc GetRbacWhoami(GetRbacWhoamiRequest) returns (GetRbacWhoamiResponse);
  rpc ListRbacPolicies(ListRbacPoliciesRequest) returns (ListRbacPoliciesResponse);
  rpc CreateRbacUser(CreateRbacUserRequest) returns (CreateRbacUserResponse);
  rpc DeleteRbacUser(DeleteRbacUserRequest) returns (DeleteRbacUserResponse);
  rpc SetRbacUserRole(SetRbacUserRoleRequest) returns (SetRbacUserRoleResponse);

  // Two-person approval ([rbac.approval]). A call on the approval list made
  // without an approval fails with FAILED_PRECONDITION and leaves a pending
  // request; once a different user with the approve right approves it, the
  // same caller repeats the identical call and it runs, once.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option (google.api.http) = { get: "/v1/approvals"; };
  }
  rpc ApproveRequest(ApproveRequestRequest) returns (ApproveRequestResponse) {
    option (google.api.http) = { post: "/v1/approvals/{id}/approve"; body: "*"; };
  }
  rpc RejectRequest(RejectRequestRequest) returns (RejectRequestResponse) {
    option (google.api.http) = { post: "/v1/approvals/{id}/reject"; body: "*"; };
  }

  // Database applications (`haify app`): a single-instance PostgreSQL, MySQL/
  // MariaDB or Redis on a resource's DRBD volume, failed over by drbd-reactor
  // (mount, database unit, service IP last). CreateApp returns the generated
  // password once; it is kept only on the volume, readable by root.
  rpc CreateApp(CreateAppRequest) returns (CreateAppResponse) {
    option (google.api.http) = { post: "/v1/apps"; body: "*"; };
  }
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse) {
    option (google.api.http) = { get: "/v1/apps"; };
  }
  rpc GetAppStatus(GetAppStatusRequest) returns (GetAppStatusResponse) {
    option (google.api.http) = { get: "/v1/apps/{name}"; };
  }
  // Takes the app out of drbd-reactor's hands and stops it. The resource and
  // its data are kept unless delete_data is set.
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse) {
    option (google.api.http) = { delete: "/v1/apps/{name}"; };
  }
  // Planned switchover: the app's node stops it and another replica takes over.
  rpc FailoverApp(FailoverAppRequest) returns (FailoverAppResponse) {
    option (google.api.http) = { post: "/v1/apps/{name}/failover"; body: "*"; };
  }
  // Freezes the database on its node (with a node-side thaw watchdog), takes
  // a resource snapshot on every replica, and thaws.
  rpc SnapshotApp(SnapshotAppRequest) returns (SnapshotAppResponse) {
    option (google.api.http) = { post: "/v1/apps/{name}/snapshots"; body: "*"; };
  }
}

// Pool messages
message CreatePoolRequest {
  string name = 1;
  string type = 2;
  string node = 3;
  repeated string disks = 4;
  uint64 size_gb = 5;
  // wipe erases a disk that holds only old data (a filesystem, a partition
  // table, the label of an array or pool that is not running). Without it
  // such a disk is refused. A disk in use is refused either way.
  bool wipe = 6;
}

message CreatePoolResponse {
  bool success = 1;
  string message = 2;
}

message DeletePoolRequest {
  string name = 1;
  string node = 2;
}

message DeletePoolResponse {
  bool success = 1;
  string message = 2;
}

message GetPoolRequest {
  string name = 1;
  string node = 2;
}

message GetPoolResponse {
  bool success = 1;
  string message = 2;
  PoolInfo pool = 3;
}

message ListPoolsRequest {}

message ListPoolsResponse {
  bool success = 1;
  string message = 2;
  repeated PoolInfo pools = 3;
}

message AddDiskToPoolRequest {
  string pool = 1;
  string disk = 2;
  string node = 3;
  // wipe erases a disk that holds only old data (a filesystem, a partition
  // table, the label of an array or pool that is not running). Without it
  // such a disk is refused. A disk in use is refused either way.
  bool wipe = 4;
}

message AddDiskToPoolResponse {
  bool success = 1;
  string message = 2;
}

message PoolInfo {
  string name = 1;
  string type = 2;
  string node = 3;
  uint64 total_gb = 4;
  uint64 free_gb = 5;
  repeated string devices = 6;
  bool thin = 7;
  string compression = 8;

  // Storage tiering (lvmcache). A pool with no fast tier reports cached=false
  // and leaves the rest zero, so a tiered pool is distinguishable from a plain
  // one in a plain `pool list`.
  bool cached = 9;
  // "writethrough" or "writeback".
  string cache_mode = 10;
  // Size of the fast device given to the cache.
  uint64 cache_size_bytes = 11;
  // Kernel dm-cache counters, rounded to whole percent. hit_percent is
  // cumulative since the cache was last activated, not a moving average.
  uint32 cache_used_percent = 12;
  uint32 cache_hit_percent = 13;
  // Share of the cache holding writes that have not reached the slow device.
  // Zero on a writethrough cache by construction; on a writeback cache this is
  // the size of the window that a lost SSD would take with it.
  uint32 cache_dirty_percent = 14;
  // The fast block device backing the cache, as the node names it.
  string cache_device = 15;
  // True when LVM reports the cache as unhealthy — a cache in this state
  // cannot be flushed, so it cannot be detached without discarding data.
  bool cache_degraded = 16;

  // Thin pool utilisation. total_gb/free_gb above describe the VOLUME GROUP,
  // and Haify gives its thin pool 95% of the group's free extents at create (all
  // of them on convert-thin), so free_gb stays near zero for the whole life of
  // such a pool however empty it is. These fields are the ones that say
  // whether the next write will succeed.
  //
  // thin_pool_lv is empty when the group holds no thin pool; that — not a zero
  // percentage — is how "no thin pool" is told apart from "a thin pool at 0%".
  string thin_pool_lv = 17;
  // Capacity of the thin pool itself, which data_percent is a percentage of.
  uint64 thin_size_bytes = 18;
  double thin_data_percent = 19;
  // Metadata exhaustion stops writes as completely as data exhaustion, and the
  // two fill for unrelated reasons, so neither substitutes for the other.
  double thin_metadata_percent = 20;
  // LVM's own verdict, from the volume health field of lv_attr rather than
  // inferred from a percentage. A pool in this state has already refused
  // writes, and the kernel drops the backing disk out from under DRBD.
  bool thin_out_of_space = 21;

  // Exact capacity. total_gb/free_gb are rounded to whole gibibytes and are
  // kept for compatibility; anything doing arithmetic or rendering a precise
  // size should use these.
  uint64 total_bytes = 22;
  uint64 free_bytes = 23;
  // compress_ratio is how much compression saves on a ZFS pool, as ZFS
  // reports it (1.85 means 1.85x); 0 when not reported. compression above is
  // the algorithm in use.
  double compress_ratio = 24;

  // VDO-backed thin pools (type "thin_vdo"). thin_data_percent above is the
  // logical space handed out; vdo_physical_percent is the physical space
  // deduplication and compression did not save, and the one that, at 100%,
  // turns writes into I/O errors. has_vdo is false for any other pool.
  bool has_vdo = 25;
  double vdo_physical_percent = 26;
  double vdo_saving_percent = 27;

  // What new volumes are carved from. On a pool with a thin pool in it that is
  // the thin pool: capacity_bytes is its size and available_bytes what its data
  // has not used. The volume group around it is nearly all allocated to it, so
  // total_*/free_* (which always describe the volume group or ZFS pool) read
  // near-full however empty the thin pool is. Elsewhere both equal
  // total_bytes/free_bytes. Zero when the controller could not measure them.
  uint64 capacity_bytes = 28;
  uint64 available_bytes = 29;
}

// ZFS messages
message CreateZFSPoolRequest {
  string name = 1;
  string node = 2;
  repeated string vdevs = 3;
  // Field 4 (bool thin) removed: ZFS has no pool-level thin/thick.
  // Thin vs thick provisioning is a zvol-level property (zfs create -s -V
  // / refreservation), handled by CreateZFSVolume, not pool creation.
  reserved 4;
  reserved "thin";
  // compression is the pool's compression algorithm (on, off, lz4, zstd,
  // zstd-1..19, gzip, gzip-1..9, lzjb, zle), set on its root dataset so every
  // volume inherits it. Empty keeps OpenZFS's default, which is on (lz4) from
  // 2.2.
  string compression = 5;
  // dedup turns on deduplication for the pool. It costs RAM for the dedup
  // table on every write; only worth it for data known to repeat.
  bool dedup = 6;
  // wipe erases a disk that holds only old data (a filesystem, a partition
  // table, the label of an array or pool that is not running). Without it
  // such a disk is refused. A disk in use is refused either way.
  bool wipe = 7;
}

