// ==================== Logs ====================

message AuditEvent {
  int64 timestamp_unix_ms = 1;
  string method = 2;          // short RPC name, e.g. "EvictHa"
  string client = 3;          // caller address, forwarded client IP when proxied
  string user = 4;            // empty when RBAC is off: no identity exists
  string target = 5;          // resource acted on, best-effort
  string result = 6;          // gRPC code, "OK" on success
  bool granted = 7;           // false only for Unauthenticated / PermissionDenied
  int64 latency_ms = 8;
  string error = 9;
  // Node that served the call. The controller relocates, so a trail spanning a
  // failover is otherwise ambiguous about where each entry came from.
  string node = 10;
}

message ListAuditEventsRequest {
  int32 limit = 1;            // newest first; 0 means a server-chosen default
  string method = 2;          // exact match filter, empty for all
  string target = 3;
  string user = 4;
  bool failures_only = 5;     // only entries whose result is not OK
  int64 since_unix_ms = 6;    // 0 for no lower bound
}

message ListAuditEventsResponse {
  bool success = 1;
  string message = 2;
  repeated AuditEvent events = 3;
  // Entries held in total, so the UI can say whether it is showing everything.
  int64 total = 4;
}

message ControllerLogEntry {
  int64 timestamp_unix_ms = 1;
  string level = 2;           // debug / info / warn / error
  string logger = 3;          // zap named logger, e.g. "audit"
  string caller = 4;
  string message = 5;
  // Structured zap fields, rendered as strings so the UI needs no type table.
  map<string, string> fields = 6;
}

message ListControllerLogsRequest {
  int32 limit = 1;            // newest first; 0 means a server-chosen default
  string level = 2;           // minimum level, empty for all
  string contains = 3;        // substring match on the message
}

message ListControllerLogsResponse {
  bool success = 1;
  string message = 2;
  repeated ControllerLogEntry entries = 3;
  // The node whose ring buffer this is — the active controller, whichever it is.
  string node = 4;
  // True when the buffer has wrapped, i.e. older lines have been discarded.
  bool truncated = 5;
}

// ==================== Node diagnostics ====================

message CollectNodeDiagnosticsRequest {
  // Nodes to read. Empty means every registered node, which is what a caller
  // investigating a cluster-wide symptom wants and is why it is the default.
  repeated string nodes = 1;
  // Collector names. Empty means all of them. An unrecognised name is returned
  // in unknown_collectors and runs nothing — a typo must not silently collect
  // less than the caller asked for.
  repeated string collectors = 2;
  // How far back to read, for the collectors that take a window (journals).
  // 0 takes the server's default.
  int32 since_minutes = 3;
  // Per collector, per node. 0 takes the server's default. A cap is not a
  // nicety here: dmesg on a node that has been up for a year is megabytes, and
  // this response is read by an assistant with a context window.
  int32 max_lines = 4;
}

// NodeCollectorOutput is one collector's reading on one node.
message NodeCollectorOutput {
  string collector = 1;
  // The exact command that produced these lines, so an operator can repeat it
  // by hand and see the same thing. A diagnosis nobody can reproduce is a
  // rumour.
  string command = 2;
  repeated string lines = 3;
  bool ok = 4;
  string error = 5;
  // True when max_lines cut this short: what follows is the tail of the record,
  // not all of it. A count of what was dropped is deliberately not reported —
  // the collector reads the tail and never sees the rest, so any number here
  // would be invented.
  bool truncated = 6;
}

message NodeDiagnostics {
  string node = 1;
  string address = 2;
  // False when the node could not be reached at all. Distinguished from a
  // collector that ran and failed: an unreachable node is itself the finding.
  bool reachable = 3;
  string error = 4;
  repeated NodeCollectorOutput collectors = 5;
}

message CollectNodeDiagnosticsResponse {
  bool success = 1;
  string message = 2;
  repeated NodeDiagnostics nodes = 3;
  repeated string unknown_collectors = 4;
  // Every collector this controller knows, so a caller that asked for all of
  // them can tell which ones it got and a caller that mistyped one can see the
  // list without a second call.
  repeated string available_collectors = 5;
}

// ==================== Events / notifications ====================

// Event is one operational notification. The same shape is delivered to
// Webhook receivers as JSON, so a receiver written against one works against
// the other.
message Event {
  // Monotonic across the controller's whole event stream, starting at 1. A
  // watcher whose ids skip a value knows it fell behind and lost events.
  uint64 id = 1;
  // Dotted "<subject>.<condition>", e.g. "resource.failover",
  // "resource.degraded", "resource.no_primary", "resource.promoted",
  // "node.unreachable", "wan.degraded".
  string type = 2;
  // "info" | "warning" | "critical".
  string severity = 3;
  // "firing" when a condition starts, "resolved" when it clears, "info" for
  // one-shot events that do neither. Pairing these is how a receiver avoids
  // treating a recovery as a new problem.
  string status = 4;
  string resource = 5;      // empty for events not scoped to a resource
  string node = 6;          // empty for events not scoped to a node
  string message = 7;       // human-readable, already formatted
  // Type-specific fields: disk_state / repl_state for degrade events,
  // from / to for failover events.
  map<string, string> details = 8;
  int64 timestamp_unix_ms = 9;
}

message ListEventsRequest {
  int32 limit = 1;              // newest first; 0 means a server-chosen default
  string min_severity = 2;      // "info" (default) | "warning" | "critical"
  repeated string types = 3;    // exact type matches; empty for all
  string resource = 4;          // empty for all
  // Only events newer than this id. Lets a client resume where it left off
  // instead of re-reading the whole buffer.
  uint64 since_id = 5;
}

message ListEventsResponse {
  bool success = 1;
  string message = 2;
  repeated Event events = 3;    // oldest first
  // Total published since the controller started. Compared against the oldest
  // id returned, this tells a client whether history has been discarded.
  uint64 published = 4;
  // Events dropped because a subscriber could not keep up.
  uint64 dropped = 5;
}

message RepairWanProxyRequest {
  string name = 1;
  // DryRun reports what would change without touching anything. Worth using
  // first: repair restarts replication tunnels.
  bool dry_run = 2;
}

message RepairWanProxyResponse {
  bool success = 1;
  string message = 2;
  // Legs the resource should have, as "<node> -> <leg id>".
  repeated string expected_legs = 3;
  // Instances removed (or, under dry_run, that would be), as "<host>: <leg id>".
  repeated string removed_legs = 4;
  // True when nothing needed changing.
  bool already_consistent = 5;
}

message WatchEventsRequest {
  string min_severity = 1;
  repeated string types = 2;
  string resource = 3;
  // Replay retained events newer than this id before streaming live ones, so a
  // reconnecting client does not miss what happened while it was away. 0 skips
  // the replay and starts from now.
  uint64 since_id = 4;
}

message ResourceInfo {
  string name = 1;
  uint32 port = 2;
  string protocol = 3;
  repeated string nodes = 4;
  string role = 5;
  repeated VolumeInfo volumes = 6;
  map<string, NodeResourceState> node_states = 7;
  // Nodes participating only as diskless quorum tiebreakers (vote, no data).
  repeated string diskless_nodes = 8;
  // True when the resource has two diskful nodes and no tiebreaker, so a
  // single node failure suspends I/O (no quorum majority).
  bool quorum_risk = 9;
  // Nodes attached as diskless data clients: no local replica, but connected
  // over DRBD and promotable to serve the volume over the network. Distinct
  // from diskless_nodes (quorum-only tiebreakers).
  repeated string diskless_clients = 10;
  map<string, string> labels = 11;
  string profile = 12;
  // WAN replication: wan_mode marks a resource with an off-site asynchronous
  // copy, and dr_node names which of `nodes` holds it. Without this the list
  // shows the DR as just another replica, which is exactly wrong — it is a
  // different site, a different protocol, and it never takes over automatically.
  bool wan_mode = 13;
  string dr_node = 14;
  // encrypted is true when every replica's backing volume is a LUKS2 container
  // (DRBD → LUKS → LVM/ZFS). Encryption at rest only — DRBD replicates the
  // plaintext, so the wire is not protected by this.
  bool encrypted = 15;
  // fault_domain_risk names the labelled fault domain(s), e.g. "host=dell",
  // whose loss would take every copy of the data or the quorum majority.
  string fault_domain_risk = 16;
}

message ResourceStatus {
  string name = 1;
  string role = 2;
  repeated string nodes = 3;
  map<string, NodeResourceState> node_states = 4;
  repeated VolumeInfo volumes = 5;
  // WAN replication (all empty/false for an ordinary LAN resource). When wan is
  // true this resource replicates over the internet via a per-resource haify-proxy
  // pair (protocol A / async), so the DR peer can lag; wan_proxy reports each
  // WAN node's `haify-proxy@<resource>` unit state (active/inactive/...).
  bool wan = 6;
  string dr_node = 7;
  string dr_endpoint = 8;
  uint32 wan_port = 9;
  map<string, string> wan_proxy = 10;
  // wan_reachable is true when the primary node can currently open a TCP
  // connection to the DR WAN endpoint (i.e. the DR firewall/security group
  // permits the mTLS port). False here explains a WAN resource that is up
  // locally but not replicating.
  bool wan_reachable = 11;
  // wan_metrics carries the counters haify-proxy publishes on the primary. Absent
  // when they could not be read (older proxy, first tick not yet written, node
  // unreachable) — absent means UNKNOWN, not zero.
  WANMetrics wan_metrics = 12;
  // quorum is what decides whether this resource keeps serving when nodes are
  // lost. It is the one number that governs availability and it was previously
  // reported nowhere: an operator had to know DRBD counts every configured node
  // (tiebreakers and the off-site DR included) and work out the majority by hand.
  QuorumInfo quorum = 13;
  // encrypted mirrors ResourceInfo.encrypted: the backing volumes are LUKS2
  // containers. Reported here because "is this volume encrypted?" is a question
  // an auditor asks of the running system, not of the creation request.
  bool encrypted = 14;
}

// QuorumInfo is the vote arithmetic behind "will this resource survive?".
message QuorumInfo {
  // members is every node in the resource config: diskful replicas, diskless
  // tiebreakers and diskless clients alike. DRBD counts them all.
  int32 members = 1;
  // required is the majority DRBD needs to keep serving: members/2 + 1.
  int32 required = 2;
  // online is how many members the reporting node can currently see, itself
  // included.
  int32 online = 3;
  // has_quorum is what DRBD itself reports, not a recomputation of the fields
  // above — they can disagree while a connection is being established, and DRBD
  // is the one that decides whether I/O proceeds.
  bool has_quorum = 4;
  // tolerated is how many further members can be lost before I/O suspends.
  // Negative is not possible; zero means the next failure stops the resource.
  int32 tolerated = 5;
}

// WANMetrics is what the primary site's haify-proxy reports about the WAN leg.
message WANMetrics {
  // buffer_used_bytes is the un-replicated backlog: writes the primary's DRBD
  // has already acknowledged to its application that have NOT yet reached the
  // DR site. Under protocol A this IS the data-loss window of a DR failover
  // performed right now — the question `resource status` previously could not
  // answer.
  uint64 buffer_used_bytes = 1;
  uint64 buffer_cap_bytes = 2;
  double buffer_fill_percent = 3;
  // Payload accepted from DRBD versus bytes actually put on the WAN, and the
  // ratio between them: the compression the link is really achieving.
  uint64 drbd_to_wan_bytes = 4;
  uint64 wan_wire_bytes = 5;
  uint64 wan_to_drbd_bytes = 6;
  uint64 frames_sent = 7;
  double compression_ratio = 8;
  bool wan_connected = 9;
  // reconnects climbing on an otherwise healthy link is the signature of a
  // flapping path; ring_full_events non-zero means the WAN could not keep up
  // with the write workload and DRBD was pushed into Ahead.
  uint64 reconnects = 10;
  uint64 ring_full_events = 11;
}

message NodeResourceState {
  string role = 1;
  string disk_state = 2;
  string replication_state = 3;
  // Percent of this peer's data in sync (0..100). 100 when steady-state / not
  // resyncing. Only meaningful for a peer whose replication_state is a resync
  // state (SyncSource/SyncTarget/PausedSync*).
  double sync_percent = 4;
  // node is the Haify node name this state belongs to. The map itself is keyed by
  // DRBD host name, which is the machine's real hostname and generally is NOT
  // the node name the rest of the API uses — so without this a caller cannot
  // pair a state with the entry of `nodes` it describes.
  string node = 5;
  // Peer DRBD connection state as the answering node sees it ("Connected",
  // "Connecting", "StandAlone", ...). Empty for the answering node itself. A
  // peer that is not Connected reports no role, disk or replication state, so
  // this is the only field that tells an unreachable replica from a healthy one.
  string connection = 6;
  // tls is whether the connection to this peer runs over TLS.
  bool tls = 7;
  // KiB written to and read from the answering node's own DRBD device since
  // it came up there, summed over volumes. Set on the answering node's entry
  // only (the one with no replication_state); unset when DRBD did not report
  // them. Two readings over time give the resource's write and read rate.
  optional uint64 written_kib = 8;
  optional uint64 read_kib = 9;
  // KiB the answering node sent to and received from this peer since their
  // connection came up, summed over volumes. Set on peer entries only.
  optional uint64 sent_kib = 10;
  optional uint64 received_kib = 11;
}

message VolumeInfo {
  uint32 volume_id = 1;
  string device = 2;
  uint64 size_gb = 3;
  // Storage pool (volume group) backing this volume.
  string pool = 4;
  // Backing logical volume name inside the pool (e.g. "<resource>_data").
  // Combined with pool it forms the "<pool>/<lv>" path used by snapshot APIs.
  string backing_volume = 5;
  // encrypted is true when DRBD consumes this volume through a LUKS2 container
  // rather than the backing LV/zvol directly. Snapshots of an encrypted volume
  // are snapshots of the ciphertext.
  bool encrypted = 6;
  // size_bytes is the device's exact size when it was given one; 0 means
  // size_gb whole GiB.
  uint64 size_bytes = 7;
}

// Snapshot messages
message CreateSnapshotRequest {
  string volume = 1;
  string snapshot_name = 2;
  string node = 3;
}

message CreateSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message DeleteSnapshotRequest {
  string volume = 1;
  string snapshot_name = 2;
  string node = 3;
}

message DeleteSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message RestoreSnapshotRequest {
  string volume = 1;
  string snapshot_name = 2;
  string node = 3;
}

message RestoreSnapshotResponse {
  bool success = 1;
  string message = 2;
}

message PopulateVolumeRequest {
  // resource / volume_id identify the freshly created, still-empty target.
  string resource = 1;
  uint32 volume_id = 2;
  // source_device is the block device to copy FROM, on `node`: an LVM snapshot
  // (/dev/<vg>/<snap>), a ZFS zvol, or another resource's backing volume.
  string source_device = 3;
  // node must hold a diskful replica of `resource` AND have source_device
  // locally; the copy runs entirely on that node.
  string node = 4;
}

message PopulateVolumeResponse {
  bool success = 1;
  string message = 2;
  // bytes_copied is what dd reported, for logging and progress reporting.
  uint64 bytes_copied = 3;
}

message ListSnapshotsRequest {
  string volume = 1;
  string node = 2;
}

message ListSnapshotsResponse {
  bool success = 1;
  string message = 2;
  repeated SnapshotInfo snapshots = 3;
}

message SnapshotInfo {
  string name = 1;
  string volume = 2;
  uint64 size_gb = 3;
  string created_at = 4;
  // The logical volume this snapshot was taken from. A pool holds the snapshots
  // of every resource on its node, and the snapshot name alone does not say
  // which one it belongs to.
  string origin = 5;
}

// Snapshot schedule messages

// GFSRetention is a grandfather-father-son retention policy: how many
// snapshots to keep per time bucket. Zero disables a bucket.
message GFSRetention {
  int32 hourly = 1;
  int32 daily = 2;
  int32 weekly = 3;
  int32 monthly = 4;
  int32 yearly = 5;
}

message SnapshotScheduleInfo {
  string name = 1;
  string resource = 2;
  string cron = 3;
  bool enabled = 4;
  GFSRetention keep = 5;
  string last_run = 6;
  string next_run = 7;
  // lock_days locks every snapshot the schedule takes for that many days.
  uint32 lock_days = 8;
  // locked_until (RFC3339) is when the newest snapshot it took stops being
  // locked; until then the schedule and its resource cannot be deleted.
  string locked_until = 9;
  // frozen_until (RFC3339) is when a freeze ends; empty when not frozen.
  string frozen_until = 10;
  string frozen_reason = 11;
}

message FreezeSnapshotScheduleRequest {
  string resource = 1;
  uint32 hours = 2;      // 0 = 168 (a week)
  string reason = 3;
}

message FreezeSnapshotScheduleResponse {
  bool success = 1;
  string message = 2;
  string frozen_until = 3;
}

message UnfreezeSnapshotScheduleRequest {
  string resource = 1;
}

message UnfreezeSnapshotScheduleResponse {
  bool success = 1;
  string message = 2;
}

message CreateSnapshotScheduleRequest {
  string resource = 1;
  string cron = 2;
  GFSRetention keep = 3;
  bool enabled = 4;
  // lock_days locks every snapshot the schedule takes for that many days: no
  // retention, full pool or API call deletes it before then. Unset keeps the
  // current schedule's lock; it can be raised at any time, lowered only once
  // nothing is locked.
  optional uint32 lock_days = 5;
}

message CreateSnapshotScheduleResponse {
  bool success = 1;
  string message = 2;
}

message ListSnapshotSchedulesRequest {}

message ListSnapshotSchedulesResponse {
  bool success = 1;
  string message = 2;
  repeated SnapshotScheduleInfo schedules = 3;
}

message DeleteSnapshotScheduleRequest {
  string name = 1;
}

message DeleteSnapshotScheduleResponse {
  bool success = 1;
  string message = 2;
}

// Backup messages

// BackupTargetInfo describes a backup repository. The secret is intentionally
// absent: a credential readable back out of the API leaks through every client
// that ever renders it.
message BackupTargetInfo {
  string name = 1;
  string kind = 2;       // s3 | smb | webdav
  string prefix = 3;
  string bucket = 4;
  string endpoint = 5;
  string region = 6;
  string host = 7;
  string share = 8;
  string user = 9;
  // description is a rendered one-line summary for display.
  string description = 10;
  string lock_mode = 11;
  uint32 lock_days = 12;
  uint32 full_every_days = 13;
}

message AddBackupTargetRequest {
  string name = 1;
  string kind = 2;
  string prefix = 3;
  string bucket = 4;
  string endpoint = 5;
  string region = 6;
  string host = 7;
  string share = 8;
  // user is the S3 access key id, or the SMB/WebDAV username.
  string user = 9;
  // secret is the S3 secret access key, or the SMB/WebDAV password. It is
  // write-only: it is never returned by any RPC. Clients are expected to read
  // it from an environment variable or a file rather than a command-line flag.
  string secret = 10;
  // secret_obscured says secret is already in rclone's obscured form.
  bool secret_obscured = 11;
  // lock_mode turns on S3 Object Lock for every object written: "governance"
  // or "compliance"; empty for none. The bucket must have Object Lock (and so
  // versioning) enabled, and rclone 1.74 or later must be on the nodes.
  string lock_mode = 12;
  // lock_days is how long every backup stays locked at the least.
  uint32 lock_days = 13;
  // full_every_days is how long an incremental chain grows on a locked
  // target before the next backup is full (default 7). Every backup of a
  // chain is locked until chain start + full_every_days + lock_days, so no
  // link expires before a backup built on it.
  uint32 full_every_days = 14;
}

message AddBackupTargetResponse {
  bool success = 1;
  string message = 2;
}

message ListBackupTargetsRequest {}

message ListBackupTargetsResponse {
  bool success = 1;
  string message = 2;
  repeated BackupTargetInfo targets = 3;
}

message DeleteBackupTargetRequest {
  string name = 1;
  bool force = 2;
}

message DeleteBackupTargetResponse {
  bool success = 1;
  string message = 2;
}

// NotifyChannelInfo describes one alert delivery channel. The signing secret is
// intentionally absent, exactly as BackupTargetInfo omits its credential: a
// secret readable back out of the API leaks through every client that renders
// it. has_secret says whether one is stored, which is what a UI needs in order
// to show "configured" without showing the value.
message NotifyChannelInfo {
  string name = 1;
  // kind is generic | feishu | slack | wecom | dingtalk.
  string kind = 2;
  string url = 3;
  string min_severity = 4;
  repeated string types = 5;
  map<string, string> headers = 6;
  bool enabled = 7;
  bool has_secret = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListNotifyChannelsRequest {}

message ListNotifyChannelsResponse {
  bool success = 1;
  string message = 2;
  repeated NotifyChannelInfo channels = 3;
  // kinds lists the message formats this controller can render, so a client
  // does not have to carry its own copy of the list and go stale.
  repeated string kinds = 4;
}

// SaveNotifyChannelRequest creates a channel or replaces one by name.
message SaveNotifyChannelRequest {
  string name = 1;
  string kind = 2;
  string url = 3;
  string min_severity = 4;
  repeated string types = 5;
  map<string, string> headers = 6;
  bool enabled = 7;
  // secret is the signing secret for kinds that authenticate that way
  // (DingTalk's 加签). Write-only: never returned by any RPC.
  //
  // An empty secret on an existing channel LEAVES THE STORED ONE ALONE, because
  // a UI cannot render the secret to send it back, so an edit of any other
  // field would otherwise silently clear it. clear_secret is how a secret is
  // actually removed.
  string secret = 8;
  bool clear_secret = 9;
}

message SaveNotifyChannelResponse {
  bool success = 1;
  string message = 2;
  NotifyChannelInfo channel = 3;
}

message DeleteNotifyChannelRequest {
  string name = 1;
}

message DeleteNotifyChannelResponse {
  bool success = 1;
  string message = 2;
}

message TestNotifyChannelRequest {
  string name = 1;
}

message TestNotifyChannelResponse {
  bool success = 1;
  // message carries the far end's own rejection text when it refused, which is
  // the part that says what to fix.
  string message = 2;
}

message BackupVolumeInfo {
  uint32 volume_id = 1;
  string object = 2;
  uint64 bytes = 3;
  string pool = 4;
  string backing_volume = 5;
  // ranges is the object listing the byte ranges an incremental image holds;
  // empty for a full image.
  string ranges = 6;
  // changed_bytes is how much of the volume an incremental image carries.
  uint64 changed_bytes = 7;
}

message BackupInfo {
  string id = 1;
  string resource = 2;
  string target = 3;
  string node = 4;
  string backend = 5;
  // state is running | completed | failed. Only completed is restorable.
  string state = 6;
  string error = 7;
  string prefix = 8;
  uint64 total_bytes = 9;
  string started_at = 10;
  string finished_at = 11;
  repeated BackupVolumeInfo volumes = 12;
  // kind is full or incremental. An incremental restores only together with
  // every backup down to the full one it is built on.
  string kind = 13;
  // parent is the backup an incremental is built on.
  string parent = 14;
  // schedule is the backup schedule (resource@target) that took it; empty for
  // a backup taken by hand. A schedule's retention deletes only its own.
  string schedule = 15;
  // lock_mode and retain_until (RFC3339) are the Object Lock its objects
  // carry; until then it cannot be deleted, by haify or by anyone using haify's
  // credentials.
  string lock_mode = 16;
  string retain_until = 17;
  // read_at (RFC3339) is the time its objects are read as of, for a backup
  // imported with as_of.
  string read_at = 18;
}

message CreateBackupRequest {
  string resource = 1;
  string target = 2;
  // node optionally pins which replica is snapshotted and read. Empty prefers
  // an UpToDate Secondary.
  string node = 3;
  // full skips the incremental path even when a base is available.
  bool full = 4;
}

message CreateBackupResponse {
  bool success = 1;
  string message = 2;
  BackupInfo backup = 3;
}

message ListBackupsRequest {
  string resource = 1;
  string target = 2;
}

message ListBackupsResponse {
  bool success = 1;
  string message = 2;
  repeated BackupInfo backups = 3;
}

message RestoreBackupRequest {
  string id = 1;
  // resource is the resource to restore INTO; empty restores into the resource
  // the backup was taken from. It must exist, be large enough, and not be in
  // use.
  string resource = 2;
  string node = 3;
}

message RestoreBackupResponse {
  bool success = 1;
  string message = 2;
  BackupInfo backup = 3;
}

message DeleteBackupRequest {
  string id = 1;
  // node optionally selects which node reaches the target to delete the
  // objects; empty uses the node that wrote the backup.
  string node = 2;
  // force drops the record even when the objects could not be removed.
  bool force = 3;
}

message DeleteBackupResponse {
  bool success = 1;
  string message = 2;
}

message ImportBackupsRequest {
  string target = 1;
  // node reads the target; empty tries the registered nodes in turn.
  string node = 2;
  // as_of (RFC3339) imports the target as it was at that time: the object
  // versions current then, before any later overwrite or delete. Restores of
  // what it imports read those versions too. S3 targets with versioning only.
  string as_of = 3;
}

message ImportBackupsResponse {
  bool success = 1;
  string message = 2;
  repeated string imported = 3;
  // skipped maps a backup id, or a manifest path when it could not be read,
  // to why it was not imported.
  map<string, string> skipped = 4;
}

// BackupScheduleInfo is a cron-driven backup of one resource to one target.
// Retention is GFS over the completed backups it made, and never breaks an
// incremental chain: a kept backup keeps everything down to its full one.
message BackupScheduleInfo {
  // name is resource@target.
  string name = 1;
  string resource = 2;
  string target = 3;
  string cron = 4;
  bool enabled = 5;
  GFSRetention keep = 6;
  string last_run = 7;
  string next_run = 8;
  // last_backup is the id the last run produced; last_error why it did not.
  string last_backup = 9;
  string last_error = 10;
}

message CreateBackupScheduleRequest {
  string resource = 1;
  string target = 2;
  string cron = 3;
  GFSRetention keep = 4;
  bool enabled = 5;
}

