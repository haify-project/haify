  uint32 port = 5;
  bool vector = 6;              // postgres with pgvector
  string mount_point = 7;       // where the Primary mounts the volume
  string unit = 8;              // the systemd unit drbd-reactor starts
  string admin_user = 9;        // the account whose password was generated
  string credentials_file = 10; // the password, root-only, on the volume
  string version = 11;          // engine version the nodes agreed on
  string connection = 12;       // how a client reaches it through the service IP
  int64 created_at_unix = 13;
}

message CreateAppRequest {
  string name = 1;
  string engine = 2;
  string resource = 3;    // default: the app's name
  string service_ip = 4;  // CIDR, required
  uint32 port = 5;        // 0: the engine's default
  bool vector = 6;        // postgres only
}

message CreateAppResponse {
  bool success = 1;
  string message = 2;
  AppInfo app = 3;
  // The generated password, returned only by the call that generated it.
  // Empty when the volume already held the app's data (data_reused).
  string password = 4;
  string primary_node = 5;  // where it was initialized
  bool data_reused = 6;
}

message ListAppsRequest {}

message ListAppsResponse {
  bool success = 1;
  string message = 2;
  repeated AppInfo apps = 3;
}

message GetAppStatusRequest {
  string name = 1;
}

message GetAppStatusResponse {
  bool success = 1;
  string message = 2;
  AppInfo app = 3;
  string primary_node = 4;   // empty when the resource is Primary nowhere
  string service_state = 5;  // systemctl is-active of the unit there
  bool healthy = 6;          // the engine's probe answered
  string state = 7;          // running, degraded or stopped
  repeated string nodes = 8; // the nodes its promoter runs on
}

message DeleteAppRequest {
  string name = 1;
  bool delete_data = 2;  // also delete the resource and its data
}

message DeleteAppResponse {
  bool success = 1;
  string message = 2;
}

message FailoverAppRequest {
  string name = 1;
}

message FailoverAppResponse {
  bool success = 1;
  string message = 2;
  string from_node = 3;
  string to_node = 4;
}

message SnapshotAppRequest {
  string name = 1;
  string snapshot = 2;
}

message SnapshotAppResponse {
  bool success = 1;
  string message = 2;
  bool frozen = 3;  // false when the app was not running (nothing to freeze)
}

// ==================== Storage upkeep ====================

message TrimPoolsRequest {
  // node limits the trim to one node; empty trims every online node.
  string node = 1;
}

message TrimResultInfo {
  string node = 1;
  string mount = 2;
  uint64 bytes = 3;
  string error = 4;
}

message TrimPoolsResponse {
  bool success = 1;
  string message = 2;
  repeated TrimResultInfo results = 3;
}

message ListPoolDisksRequest {
  string pool = 1;
  string node = 2;
}

message PoolDiskInfo {
  string node = 1;
  string pool = 2;
  string device = 3;
  uint64 size_bytes = 4;
  uint64 used_bytes = 5;
  // health is "ok", "warn", "fail" or "unknown" (no SMART on this device,
  // e.g. a virtual disk); health_detail says why.
  string health = 6;
  string health_detail = 7;
  string model = 8;
  string serial = 9;
}

message ListPoolDisksResponse {
  bool success = 1;
  string message = 2;
  repeated PoolDiskInfo disks = 3;
}

message ListNodeDisksRequest {
  // node limits the list to one node; empty lists every online node.
  string node = 1;
}

message NodeDiskInfo {
  string node = 1;
  string device = 2;
  // by_id is the /dev/disk/by-id link naming the physical disk (its WWN
  // where it has one), which survives reboots that renumber /dev/sdX.
  string by_id = 3;
  // type is lsblk's: disk, part or mpath.
  string type = 4;
  uint64 size_bytes = 5;
  string model = 6;
  string serial = 7;
  string transport = 8;
  bool rotational = 9;
  // state is "free" (usable as it is), "wipe" (holds only old data; usable
  // with wipe), "pool" (in a Haify pool) or "busy" (in use; never touched).
  string state = 10;
  string pool = 11;
  // detail says what a "wipe" disk holds or what a "busy" disk is used by.
  string detail = 12;
}

message ListNodeDisksResponse {
  bool success = 1;
  string message = 2;
  repeated NodeDiskInfo disks = 3;
}

message RemovePoolDiskRequest {
  string pool = 1;
  string node = 2;
  string disk = 3;
}

message ReplacePoolDiskRequest {
  string pool = 1;
  string node = 2;
  string old_disk = 3;
  string new_disk = 4;
  // wipe erases a disk that holds only old data (a filesystem, a partition
  // table, the label of an array or pool that is not running). Without it
  // such a disk is refused. A disk in use is refused either way.
  bool wipe = 5;
}

message MoveVolumeRequest {
  string resource = 1;
  int32 volume_id = 2;
  // pool is the destination pool; it must exist on every diskful node.
  string pool = 3;
}

message StorageJobResponse {
  bool success = 1;
  string message = 2;
  string job_id = 3;
}

message ListStorageJobsRequest {
  bool include_finished = 1;
}

message StorageJobInfo {
  string id = 1;
  // kind is "remove-disk", "replace-disk" or "move-volume".
  string kind = 2;
  string state = 3;
  string subject = 4;
  string progress = 5;
  string message = 6;
  int64 started_unix = 7;
  int64 updated_unix = 8;
}

message ListStorageJobsResponse {
  bool success = 1;
  string message = 2;
  repeated StorageJobInfo jobs = 3;
}
