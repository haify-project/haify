}

// Node messages
message RegisterNodeRequest {
  string address = 1;
  string name = 2;
  // replication_address is the address DRBD uses for this node in generated
  // .res files, letting replication traffic ride a dedicated NIC/subnet while
  // the controller keeps reaching the node over `address` (SSH/management).
  // Empty means "same as address", which is the historical behavior.
  string replication_address = 3;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

// SetNodeLabels sets or merges key=value labels on a node. When replace is
// true the node's labels are replaced wholesale; otherwise the given labels are
// merged in (a label with an empty value deletes that key).
message SetNodeLabelsRequest {
  string node = 1; // node name or address
  map<string, string> labels = 2;
  bool replace = 3;
}

message SetNodeLabelsResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

message UnregisterNodeRequest {
  string address = 1;
}

message UnregisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message GetNodeRequest {
  string address = 1;
}

message GetNodeResponse {
  bool success = 1;
  string message = 2;
  NodeInfo node = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  bool success = 1;
  string message = 2;
  repeated NodeInfo nodes = 3;
}

message NodeInfo {
  string name = 1;
  string address = 2;
  string hostname = 3;
  string state = 4;
  int64 last_seen = 5;
  string version = 6;
  // labels are arbitrary key=value tags on the node (e.g. rack=A, zone=east)
  // used by placement constraints like replicas_on_different.
  map<string, string> labels = 7;
  // replication_address is the address DRBD uses for this node. Empty means it
  // shares `address` (the historical single-network setup).
  string replication_address = 8;
  // offline_since is when the node stopped answering (Unix seconds), 0 while
  // it answers. Self-healing counts from it.
  int64 offline_since = 9;
  // replication_paths are further addresses DRBD uses for this node, one per
  // additional replication network; each pair of nodes gets a path per
  // network both are on.
  repeated string replication_paths = 10;
}

// Health check messages
message HealthCheckRequest {
  string node = 1;
}

message HealthCheckResponse {
  bool success = 1;
  string message = 2;
  NodeHealthInfo health = 3;
