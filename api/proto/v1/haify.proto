// AddDRRequest attaches an asynchronous off-site replica to a resource that is
// already running, turning a LAN cluster into the two-site shape in place.
message AddDRRequest {
  string resource = 1;
  string dr_node = 2;           // registered node that will hold the remote copy
  string dr_endpoint = 3;       // public address the primary site dials
  uint32 wan_port = 4;          // base haify-proxy port; 0 auto-allocates
  string egress_address = 5;    // optional source address for the primary site
}

message AddDRResponse {
  bool success = 1;
  string message = 2;
  uint32 wan_port = 3;
}

// AddReplicaRequest adds a diskful local replica to a running resource. On a
// two-site resource the new node also gets its own WAN leg to the DR: DRBD 9 is
// a full mesh, and a replica the DR cannot reach ends replication the moment it
// is promoted.
message AddReplicaRequest {
  string resource = 1;
  string node = 2;
  // ignore_free_space adds the replica although the node's pool has less free
  // space than the volume, which the sync writes in full. Without it that is
  // refused: a full thin pool fails the sync's writes and drops the new disk.
  bool ignore_free_space = 3;
  // allow_unreachable adds the replica while a minority of the resource's
  // members do not answer; they get the new config when they are back.
  bool allow_unreachable = 4;
}

// RemoveReplicaRequest takes a diskful replica out of a running resource. The
// inverse of AddReplica; refused when the node is Primary, is the tiebreaker or
// the DR, or when fewer than two diskful copies would remain.
message RemoveReplicaRequest {
  string resource = 1;
  string node = 2;
  // lost removes the replica of a node that is gone for good: nothing is run
  // on it, only the survivors' configs change. Refused while the node answers
  // or any survivor is still connected to it.
  bool lost = 3;
}

message RemoveReplicaResponse {
  bool success = 1;
  string message = 2;
}

message AddReplicaResponse {
  bool success = 1;
  string message = 2;
}

message EvictHaResponse {
  bool success = 1;
  string message = 2;
}

